name: Temporary Security-Auditing 4699-4709 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-07-4699-4709

permissions:
  contents: write
  actions: read

jobs:
  apply-validate-commit:
    if: contains(github.event.head_commit.message, 'Run bounded Security-Auditing 4699-4709 apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure reusable helper history is available
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e a5757f49df3b83b5a915ebf578d0678b6ffbcbf4^{commit} || git fetch origin content/windows-security-auditing-batch-06-4689-4698 --depth=20
          git cat-file -e a5757f49df3b83b5a915ebf578d0678b6ffbcbf4^{commit}
          git cat-file -e 3feda12eecc037fb4039cd6040b485eba29c3393^{commit} || git fetch origin content/windows-security-auditing-batch-04-4654-4663 --depth=20
          git cat-file -e 3feda12eecc037fb4039cd6040b485eba29c3393^{commit}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Download checksum-bound discovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-batch07
          gh api /repos/${{ github.repository }}/actions/artifacts/11478270373/zip > /tmp/atlas-batch07/evidence.zip
          unzip -q /tmp/atlas-batch07/evidence.zip -d /tmp/atlas-batch07/evidence
          test -f /tmp/atlas-batch07/evidence/security-auditing-4699-4709.json
          echo "b486c1cb4b2380e14e9eba77fc79efa09734faff9ff90a221a6ad3f0acc42633  /tmp/atlas-batch07/evidence/security-auditing-4699-4709.json" | sha256sum -c -

      - name: Apply bounded content mutation
        env:
          ATLAS_DISCOVERY_JSON: /tmp/atlas-batch07/evidence/security-auditing-4699-4709.json
        run: python tools/tmp_apply_security_auditing_4699_4709.py

      - name: Validate focused Phase 5.10.10 contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          paths = [
              Path("tests/phase51010/test_windows_security_auditing_4699_4709.py"),
              Path("tests/phase51010/test_windows_security_auditing_4689_4698.py"),
              Path("tests/phase51010/test_windows_security_auditing_4664_4675.py"),
              Path("tests/phase51010/test_windows_security_auditing_4654_4663.py"),
              Path("tests/phase51010/test_windows_security_auditing_4626_4653.py"),
              Path("tests/phase51010/test_windows_security_coverage_snapshot.py"),
              Path("tests/phase51010/test_windows_security_eventlog_1100_series.py"),
          ]
          for path in paths:
              spec = importlib.util.spec_from_file_location(path.stem, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tests = [(name, value) for name, value in sorted(vars(module).items()) if name.startswith("test_") and callable(value)]
              if not tests:
                  raise RuntimeError(f"no test functions found in {path}")
              for name, test in tests:
                  test()
                  print(f"PASS {path}:{name}")
          PY
          python tools/content/validate_encyclopedia_coverage.py
          python tools/content/build_encyclopedia_records.py --output /tmp/encyclopedia-records.jsonl

      - name: Validate ingestion authorization and syntax
        run: |
          python tools/ingestion/validate_ingestion_authorization.py
          python -m compileall -q tools/content tests/phase51010 tools/tmp_apply_security_auditing_4699_4709.py
          git diff --check

      - name: Guard temporary artifacts from durable commit
        run: |
          git status --short
          test -f .github/workflows/tmp-security-auditing-4699-4709-discovery.yml
          test -f .github/workflows/tmp-security-auditing-4699-4709-apply.yml
          test -f tools/tmp_apply_security_auditing_4699_4709.py
          test -f .tmp-trigger-security-auditing-4699-4709

      - name: Commit durable outputs only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "Cyber-Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            content/encyclopedia \
            docs/windows-security-log-scope.md \
            docs/releases/third-party-redistribution-inventory.json \
            ingestion/inventories/windows-security-auditing-4699-4709-26100.telemetry.json \
            tests/phase51010
          if git diff --cached --quiet; then
            echo "No durable changes to commit" >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(tmp_|tmp-|temporary)' ; then
            echo "Temporary artifact entered durable commit set" >&2
            exit 1
          fi
          git commit -m "Content: add Security-Auditing 4699-4709 coverage"
          git push origin HEAD:content/windows-security-auditing-batch-07-4699-4709
