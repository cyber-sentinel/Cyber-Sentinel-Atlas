name: Temporary cancel redundant post-merge main run

on:
  push:
    branches:
      - build/security-auditing-batches-36-43
    paths:
      - '.github/workflows/tmp-cancel-redundant-main-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_IDS: '37961409210 37961409142'
    steps:
      - name: Force-cancel invalidated prior-head runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in ${RUN_IDS}; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" || true
            echo "requested-force-cancel=${run_id}"
          done
