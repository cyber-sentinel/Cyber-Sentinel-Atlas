name: Temporary Security-Auditing 4626-4653 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-03-4626-4653

permissions:
  contents: write
  actions: read

jobs:
  apply-validate-commit:
    if: contains(github.event.head_commit.message, 'Run bounded Security-Auditing 4626-4653 apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Download checksum-bound discovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-batch03
          gh api /repos/${{ github.repository }}/actions/artifacts/11425305259/zip > /tmp/atlas-batch03/evidence.zip
          unzip -q /tmp/atlas-batch03/evidence.zip -d /tmp/atlas-batch03/evidence
          test -f /tmp/atlas-batch03/evidence/security-auditing-4626-4653.json
          echo "dda97115ed3461171de433b0bfb7d2c52d45032aa7d004f27facf7d1fd52356a  /tmp/atlas-batch03/evidence/security-auditing-4626-4653.json" | sha256sum -c -

      - name: Apply bounded content mutation
        env:
          ATLAS_DISCOVERY_JSON: /tmp/atlas-batch03/evidence/security-auditing-4626-4653.json
        run: python tools/tmp_apply_security_auditing_4626_4653.py

      - name: Preserve authoritative titles while disambiguating search aliases
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("content/encyclopedia/approved-exemplars.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          aliases = {
              "4652": ["4652", "Event ID 4652", "Windows 4652", "IPsec Main Mode negotiation failed — certificate context"],
              "4653": ["4653", "Event ID 4653", "Windows 4653", "IPsec Main Mode negotiation failed — non-certificate-detail context"],
          }
          seen = set()
          for item in doc["events"]:
              event_id = str(item.get("native_event_id", ""))
              if event_id in aliases and item.get("namespace") == "microsoft.windows.security":
                  item["aliases"] = aliases[event_id]
                  seen.add(event_id)
          if seen != set(aliases):
              raise SystemExit(f"Expected both IPsec failure identities, found {sorted(seen)}")
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate focused Phase 5.10.10 contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          paths = [
              Path("tests/phase51010/test_windows_security_auditing_4626_4653.py"),
              Path("tests/phase51010/test_windows_security_auditing_4609_4622.py"),
              Path("tests/phase51010/test_windows_security_coverage_snapshot.py"),
              Path("tests/phase51010/test_windows_security_eventlog_1100_series.py"),
          ]
          for path in paths:
              spec = importlib.util.spec_from_file_location(path.stem, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tests = [(name, value) for name, value in sorted(vars(module).items()) if name.startswith("test_") and callable(value)]
              if not tests:
                  raise RuntimeError(f"no test functions found in {path}")
              for name, test in tests:
                  test()
                  print(f"PASS {path}:{name}")
          PY
          python tools/content/validate_encyclopedia_coverage.py
          python tools/content/build_encyclopedia_records.py --output /tmp/encyclopedia-records.jsonl

      - name: Validate ingestion authorization and syntax
        run: |
          python tools/ingestion/validate_ingestion_authorization.py
          python -m compileall -q tools/content tests/phase51010 tools/tmp_apply_security_auditing_4626_4653.py
          git diff --check

      - name: Guard temporary artifacts from durable commit
        run: |
          git status --short
          test -f .github/workflows/tmp-security-auditing-4626-4653-discovery.yml
          test -f .github/workflows/tmp-security-auditing-4626-4653-apply.yml
          test -f tools/tmp_apply_security_auditing_4626_4653.py
          test -f .tmp-trigger-security-auditing-4626-4653

      - name: Commit durable outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cyber-Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            content/encyclopedia \
            docs/windows-security-log-scope.md \
            docs/releases/third-party-redistribution-inventory.json \
            ingestion/inventories/windows-security-auditing-4626-4653-26100.telemetry.json \
            tests/phase51010
          if git diff --cached --quiet; then
            echo "No durable changes to commit" >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(tmp_|tmp-|temporary)' ; then
            echo "Temporary artifact entered durable commit set" >&2
            exit 1
          fi
          git commit -m "Content: add Security-Auditing 4626-4653 coverage"
          git push origin HEAD:content/windows-security-auditing-batch-03-4626-4653
