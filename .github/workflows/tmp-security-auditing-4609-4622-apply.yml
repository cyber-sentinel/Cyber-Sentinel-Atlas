name: Temporary Security-Auditing 4609-4622 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-02-4609-4622

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: contains(github.event.head_commit.message, 'Run bounded Security-Auditing 4609-4622 apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply bounded content mutation
        run: python3 tools/tmp_apply_security_auditing_4609_4622.py

      - name: Validate focused Phase 5.10.10 contracts
        run: |
          python3 -m pytest -q \
            tests/phase51010/test_windows_security_auditing_4609_4622.py \
            tests/phase51010/test_windows_security_coverage_snapshot.py \
            tests/phase51010/test_windows_security_eventlog_1100_series.py
          python3 tools/content/validate_encyclopedia_coverage.py
          python3 tools/content/build_encyclopedia_records.py --output /tmp/encyclopedia-records.jsonl

      - name: Validate ingestion foundation and syntax
        run: |
          python3 tools/ingestion/validate_ingestion_foundation.py
          python3 -m compileall -q tools/content tests/phase51010 tools/tmp_apply_security_auditing_4609_4622.py
          git diff --check

      - name: Guard temporary artifacts from durable commit
        run: |
          git status --short
          test -f .github/workflows/tmp-security-auditing-4609-4622-discovery.yml
          test -f .github/workflows/tmp-security-auditing-4609-4622-apply.yml
          test -f tools/tmp_apply_security_auditing_4609_4622.py

      - name: Commit durable outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cyber-Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            content/encyclopedia \
            docs/windows-security-log-scope.md \
            docs/releases/third-party-redistribution-inventory.json \
            ingestion/inventories/windows-security-auditing-4609-4622-26100.telemetry.json \
            tests/phase51010
          if git diff --cached --quiet; then
            echo "No durable changes to commit" >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(tmp_|tmp-|temporary)' ; then
            echo "Temporary artifact entered durable commit set" >&2
            exit 1
          fi
          git commit -m "Content: add Security-Auditing 4609-4622 coverage"
          git push origin HEAD:content/windows-security-auditing-batch-02-4609-4622
