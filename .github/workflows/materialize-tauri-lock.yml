name: Materialize verified Tauri Cargo lock

on:
  push:
    branches:
      - feature/phase-5.6-windows-desktop-mvp
    paths:
      - '.github/workflows/materialize-tauri-lock.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize-lock:
    name: materialize verified Cargo.lock
    runs-on: [self-hosted, windows, x64, atlas-ci, atlas-windows]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore exact verified Tauri lockfile from successful evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = 10439631962
          $expectedSha256 = 'dd2a97c412b0f7289f07ba16cfc28b4cca02ea9b7a5f5ed4d488b34977e37b3e'
          $expectedLines = 4510
          $target = 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'

          if (Test-Path -LiteralPath $target -PathType Leaf) {
            $existingHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
            if ($existingHash -ne $expectedSha256) {
              throw "existing committed Cargo.lock hash mismatch: $existingHash"
            }
            Write-Host 'Verified Cargo.lock already exists; no materialization required.'
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'phase561-lock-source.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'phase561-lock-source'
          Remove-Item -Force -LiteralPath $zip -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force -LiteralPath $extract -ErrorAction SilentlyContinue

          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip"
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $source = Get-ChildItem -LiteralPath $extract -File -Recurse -Filter 'tauri-Cargo.lock' | Select-Object -First 1
          if ($null -eq $source) { throw 'tauri-Cargo.lock not found in verified evidence artifact' }

          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $source.FullName).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "artifact Cargo.lock SHA-256 mismatch: expected $expectedSha256, found $actualSha256"
          }
          $lineCount = (Get-Content -LiteralPath $source.FullName).Count
          if ($lineCount -ne $expectedLines) {
            throw "artifact Cargo.lock line-count mismatch: expected $expectedLines, found $lineCount"
          }

          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source.FullName -Destination $target -Force
          $committedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          if ($committedHash -ne $expectedSha256) { throw 'post-copy Cargo.lock hash mismatch' }

          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add -- $target
          git diff --cached --exit-code --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Cargo.lock materialization produced no staged change' }
          git commit -m 'build: commit verified Tauri dependency lock'
          if ($LASTEXITCODE -ne 0) { throw 'failed to commit verified Cargo.lock' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'failed to push verified Cargo.lock commit' }
