name: Temporary README sync after Batch 11

on:
  push:
    branches:
      - docs/sync-readme-after-batch-11
    paths:
      - '.github/workflows/tmp-sync-readme-after-batch-11.yml'

permissions:
  contents: write

jobs:
  sync-readmes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Project authoritative coverage into README files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('content/encyclopedia/coverage-manifest.json').read_text(encoding='utf-8'))
          fam = next(x for x in manifest['families'] if x['id'] == 'windows-security-auditing')
          uws = manifest['windows_security_log_review_benchmark']
          snapshot = json.loads(Path(fam['snapshot']).read_text(encoding='utf-8'))

          assert fam['denominator_count'] == 423
          assert fam['encyclopedia_grade_count'] == 110
          assert fam['remaining_count'] == 313
          assert uws['completion_ratio'] == '116/422'
          assert uws['completion_percent'] == 27.49
          assert uws['remaining_listed_id_count'] == 306

          grade_ids = [str(x['event_id']) for x in snapshot['events'] if x['coverage_state'] == 'ENCYCLOPEDIA_GRADE']
          assert len(grade_ids) == 110
          assert {'4743','4744','4745','4746','4747','4748','4749','4750','4751','4752'} <= set(grade_ids)

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          indexes = [i for i,line in enumerate(lines) if line.startswith('| Windows Security Auditing |')]
          assert len(indexes) == 1
          ids = ', '.join(f'`{eid}`' for eid in grade_ids)
          lines[indexes[0]] = (
              f"| Windows Security Auditing | {fam['denominator_count']} unique Event IDs on "
              f"`{fam['denominator_scope']}` | {fam['encyclopedia_grade_count']} — {ids} | {fam['remaining_count']} |"
          )
          text = '\n'.join(lines) + '\n'

          marker = 'The authoritative machine-readable ledger is [`content/encyclopedia/coverage-manifest.json`](content/encyclopedia/coverage-manifest.json).'
          benchmark = (
              'The cross-provider Windows Security Log **Ultimate Windows Security (UWS) review benchmark** is currently '
              f"**{uws['completion_ratio']}** listed Event IDs (**{uws['completion_percent']}%**), with "
              f"**{uws['remaining_listed_id_count']}** remaining. UWS is used only as a controlled coverage / Quick Detail review benchmark; "
              'Microsoft official documentation plus controlled provider/channel/version evidence remain semantic authority, and third-party prose is not bulk-ingested.'
          )
          assert marker in text
          # Replace a prior generated benchmark sentence if one exists; otherwise insert it immediately before the ledger authority line.
          text = re.sub(
              r'The cross-provider Windows Security Log \*\*Ultimate Windows Security \(UWS\) review benchmark\*\* is currently .*?bulk-ingested\.\n\n',
              benchmark + '\n\n',
              text,
              flags=re.S,
          )
          if benchmark not in text:
              text = text.replace(marker, benchmark + '\n\n' + marker, 1)
          p.write_text(text, encoding='utf-8')

          ip = Path('ingestion/README.md')
          it = ip.read_text(encoding='utf-8')
          pattern = re.compile(
              r'Current reviewed `main` coverage is \*\*\d+/423\*\* encyclopedia-grade Event IDs for `Microsoft-Windows-Security-Auditing`, '
              r'while the cross-provider Security Log UWS review benchmark is \*\*\d+/422\*\* and Sysmon 15\.22 remains \*\*30/30\*\* complete\.'
          )
          replacement = (
              'Current reviewed `main` coverage is **110/423** encyclopedia-grade Event IDs for `Microsoft-Windows-Security-Auditing`, '
              'while the cross-provider Security Log UWS review benchmark is **116/422** and Sysmon 15.22 remains **30/30** complete.'
          )
          it2, n = pattern.subn(replacement, it, count=1)
          assert n == 1
          ip.write_text(it2, encoding='utf-8')

          print(f"README sync PASS security={fam['encyclopedia_grade_count']}/{fam['denominator_count']} uws={uws['completion_ratio']} sysmon=30/30")
          PY

      - name: Verify README projections
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '| Windows Security Auditing | 423 unique Event IDs' README.md
          grep -Fq '| 110 — ' README.md
          grep -Fq '116/422' README.md
          grep -Fq '`4743`' README.md
          grep -Fq '`4752`' README.md
          grep -Fq '**110/423**' ingestion/README.md
          grep -Fq '**116/422**' ingestion/README.md

      - name: Remove temporary workflow and commit docs sync
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-readme-after-batch-11.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md ingestion/README.md
          git diff --cached --check
          git status --short
          git commit -m 'Docs: synchronize README coverage after Batch 11'
          git push origin "HEAD:${GITHUB_REF_NAME}"
