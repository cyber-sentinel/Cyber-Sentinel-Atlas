name: One-shot Self-hosted Workflow Migration

on:
  push:
    branches:
      - ops/migrate-active-workflows-self-hosted
    paths:
      - '.github/workflows/migrate-self-hosted-once.yml'
      - 'scripts/ci/migrate-workflows-self-hosted.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, atlas-ci, atlas-linux]
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic runner migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/migrate-workflows-self-hosted.py

      - name: Review migration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows tests/phase53/test_reference_host_collection.py

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows tests/phase53/test_reference_host_collection.py
          git diff --cached --quiet && { echo 'No staged migration changes'; exit 1; }
          git commit -m 'ci: migrate Atlas workflows to self-hosted runners'
          git push origin HEAD:${GITHUB_REF_NAME}
