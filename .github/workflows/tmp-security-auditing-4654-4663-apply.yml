name: Temporary Security-Auditing 4654-4663 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-04-4654-4663

permissions:
  contents: write
  actions: read

jobs:
  apply-validate-commit:
    if: contains(github.event.head_commit.message, 'Run bounded Security-Auditing 4654-4663 apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Download checksum-bound discovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-batch04
          gh api /repos/${{ github.repository }}/actions/artifacts/11430091652/zip > /tmp/atlas-batch04/evidence.zip
          unzip -q /tmp/atlas-batch04/evidence.zip -d /tmp/atlas-batch04/evidence
          test -f /tmp/atlas-batch04/evidence/security-auditing-4654-4663.json
          echo "135c03313f17821eb27e163a18c352cdd4f036ecb2b41ef361e977073311c050  /tmp/atlas-batch04/evidence/security-auditing-4654-4663.json" | sha256sum -c -

      - name: Apply bounded content mutation
        env:
          ATLAS_DISCOVERY_JSON: /tmp/atlas-batch04/evidence/security-auditing-4654-4663.json
        run: python tools/tmp_apply_security_auditing_4654_4663.py

      - name: Validate focused Phase 5.10.10 contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          paths = [
              Path("tests/phase51010/test_windows_security_auditing_4654_4663.py"),
              Path("tests/phase51010/test_windows_security_auditing_4626_4653.py"),
              Path("tests/phase51010/test_windows_security_auditing_4609_4622.py"),
              Path("tests/phase51010/test_windows_security_coverage_snapshot.py"),
              Path("tests/phase51010/test_windows_security_eventlog_1100_series.py"),
          ]
          for path in paths:
              spec = importlib.util.spec_from_file_location(path.stem, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tests = [(name, value) for name, value in sorted(vars(module).items()) if name.startswith("test_") and callable(value)]
              if not tests:
                  raise RuntimeError(f"no test functions found in {path}")
              for name, test in tests:
                  test()
                  print(f"PASS {path}:{name}")
          PY
          python tools/content/validate_encyclopedia_coverage.py
          python tools/content/build_encyclopedia_records.py --output /tmp/encyclopedia-records.jsonl

      - name: Validate ingestion authorization and syntax
        run: |
          set -euo pipefail
          python tools/ingestion/validate_ingestion_authorization.py
          python -m compileall -q tools/content tests/phase51010 tools/tmp_apply_security_auditing_4654_4663.py
          find tools tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools tests -type f -name '*.pyc' -delete
          git diff --check

      - name: Guard temporary artifacts from durable commit
        run: |
          git status --short
          test -f .github/workflows/tmp-security-auditing-4654-4663-discovery.yml
          test -f .github/workflows/tmp-security-auditing-4654-4663-apply.yml
          test -f tools/tmp_apply_security_auditing_4654_4663.py
          test -f .tmp-trigger-security-auditing-4654-4663
          test -z "$(find tools tests -type f -name '*.pyc' -print -quit)"

      - name: Commit durable outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cyber-Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            content/encyclopedia \
            docs/windows-security-log-scope.md \
            docs/releases/third-party-redistribution-inventory.json \
            ingestion/inventories/windows-security-auditing-4654-4663-26100.telemetry.json \
            tests/phase51010
          if git diff --cached --quiet; then
            echo "No durable changes to commit" >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(tmp_|tmp-|temporary)|(__pycache__|\.pyc$)' ; then
            echo "Temporary or generated artifact entered durable commit set" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Content: add Security-Auditing 4654-4663 coverage"
          git push origin HEAD:content/windows-security-auditing-batch-04-4654-4663
