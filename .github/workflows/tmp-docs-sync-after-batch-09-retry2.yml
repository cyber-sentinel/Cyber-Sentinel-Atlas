name: Temporary docs sync after Batch 09 retry 2

on:
  push:
    branches:
      - docs/sync-coverage-after-batch-09

permissions:
  contents: write

jobs:
  sync-docs-retry2:
    if: contains(github.event.head_commit.message, 'Retry2 bounded docs sync after Batch 09')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Execute file-specific bounded sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          wf = Path('.github/workflows/tmp-docs-sync-after-batch-09.yml').read_text()
          marker = "python - <<'PY'\n"
          code = wf.split(marker,1)[1].split("\n          PY",1)[0]
          code = textwrap.dedent(code)
          prefix = code.split('# fail-closed scope and stale-current checks',1)[0]
          validation = "\n".join([
              "# fail-closed scope and file-specific current-state checks",
              "allowed={'README.md','docs/README.md','docs/current-status.md','docs/product-surfaces.md','docs/project-state.md','docs/roadmap.md','docs/windows-sysmon-coverage-plan.md','ingestion/README.md','ingestion/source-profiles/README.md'}",
              "import subprocess",
              "changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())",
              "if changed != allowed: raise SystemExit(f'unexpected durable scope: {sorted(changed)}')",
              "checks={",
              " 'README.md': ('90 — ', '| 333 |'),",
              " 'docs/README.md': ('96/422','90/423','333'),",
              " 'docs/current-status.md': ('PR #171','96/422','90/423','ae2a18bb91315efcb5537877480757a0c7f01ebd'),",
              " 'docs/product-surfaces.md': ('90/423','333'),",
              " 'docs/project-state.md': ('PR #171','96/422','90/423','ae2a18bb91315efcb5537877480757a0c7f01ebd'),",
              " 'docs/roadmap.md': ('96/422','90/423','333'),",
              " 'docs/windows-sysmon-coverage-plan.md': ('96/422','90 — ','333'),",
              " 'ingestion/README.md': ('96/422','90/423'),",
              " 'ingestion/source-profiles/README.md': ('96/422','90/423'),",
              "}",
              "for p, needles in checks.items():",
              " txt=load(p)",
              " missing=[n for n in needles if n not in txt]",
              " if missing: raise SystemExit(f'new coverage projection missing in {p}: {missing}')",
              "print(f'coverage={uws_ratio} security_auditing={sa_ratio} files={len(changed)}')",
          ])
          exec(compile(prefix + validation,'bounded-docs-sync','exec'), {'__name__':'__main__'})
          PY
          git diff --check
      - name: Validate authoritative coverage and queue
        run: |
          python tools/content/validate_encyclopedia_coverage.py
          python tools/content/build_windows_security_review_queue.py --batch-size 10 --batch-index 0 >/tmp/review-queue.json
          grep -q '4731' /tmp/review-queue.json
      - name: Commit exactly nine durable documentation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cyber-Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/README.md docs/current-status.md docs/product-surfaces.md docs/project-state.md docs/roadmap.md docs/windows-sysmon-coverage-plan.md ingestion/README.md ingestion/source-profiles/README.md
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit -m "Docs: synchronize coverage after PR #171"
          git push origin HEAD:docs/sync-coverage-after-batch-09
