name: Temporary Security-Auditing 4743-4752 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-11-4743-4752
    paths:
      - '.github/workflows/tmp-security-auditing-4743-4752-apply.yml'

permissions:
  actions: read
  contents: write

jobs:
  apply-bounded-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download trusted Batch 11 provider artifact
        uses: actions/download-artifact@v5
        with:
          name: security-auditing-4743-4752-provider-metadata
          path: .atlas-batch11
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cyber-sentinel/Cyber-Sentinel-Atlas
          run-id: 37664692346

      - name: Verify and apply bounded Batch 11 evidence
        shell: bash
        env:
          ATLAS_DISCOVERY_JSON: .atlas-batch11/security-auditing-4743-4752.json
        run: |
          set -euo pipefail
          test "$(sha256sum "$ATLAS_DISCOVERY_JSON" | awk '{print $1}')" = "79439457a025d2acfa7ef9672b6fc1c59e3a1ce596d610d10ec896df65d1c9d0"
          python3 tools/tmp_apply_security_auditing_4743_4752.py

      - name: Run focused corpus validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          paths = [
              Path('tests/phase51010/test_windows_security_coverage_snapshot.py'),
              Path('tests/phase51010/test_windows_security_auditing_4731_4742.py'),
              Path('tests/phase51010/test_windows_security_auditing_4743_4752.py'),
          ]
          for idx, path in enumerate(paths):
              spec = importlib.util.spec_from_file_location(f'atlas_batch11_test_{idx}', path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              tests = [getattr(mod, name) for name in sorted(dir(mod)) if name.startswith('test_') and callable(getattr(mod, name))]
              assert tests, f'no tests discovered in {path}'
              for test in tests:
                  test()
              print(f'PASS {path} ({len(tests)} tests)')
          PY

      - name: Validate new inventory contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.ingestion import validate_ingestion_foundation as f
          p=Path('ingestion/inventories/windows-security-auditing-4743-4752-26100.telemetry.json')
          d=json.loads(p.read_text())
          errors=sorted(f.ingestion_validator('inventory-definition.schema.json').iter_errors(d), key=lambda e:list(e.path))
          assert not errors, [e.message for e in errors]
          assert d['digest']==f.digest_without_field(d,'digest')
          print('inventory-schema=PASS digest=PASS')
          PY

      - name: Remove temporary execution scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            tools/tmp_apply_security_auditing_4743_4752.py \
            .github/workflows/tmp-security-auditing-4743-4752-discovery.yml \
            .github/workflows/tmp-security-auditing-4743-4752-apply.yml
          rm -rf .atlas-batch11

      - name: Commit bounded Batch 11 corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Content: promote Security-Auditing 4743-4752'
          git push origin "HEAD:${GITHUB_REF_NAME}"
