name: Temporary rebuild Security-Auditing Batch 22-35 from fresh main

on:
  push:
    branches:
      - build/security-auditing-batches-22-35
    paths:
      - 'tmp/security-batch-request-22-35.json'

permissions:
  actions: read
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOVERY_RUN: '37826533823'
      UWS_RUN: '37826876988'
      UWS_ARTIFACT_NAME: 'uws-batches22-35-verification-v2'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse bounded request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('tmp/security-batch-request-22-35.json').read_text())
          b=int(r['batch']); ids=[int(x) for x in r['ids']]
          assert 22<=b<=35 and len(ids)==10 and ids==sorted(ids)
          assert int(r['expected_provider_before'])==210+10*(b-22)
          print(f'batch={b}')
          print('ids='+','.join(map(str,ids)))
          print(f'first={ids[0]}'); print(f'last={ids[-1]}')
          print(f'expected_before={r["expected_provider_before"]}')
          print(f'provider_artifact=security-auditing-batch{b}-provider-metadata-v2')
          print(f'branch=content/windows-security-auditing-batch-{b}-{ids[0]}-{ids[-1]}')
          PY

      - name: Preserve dynamic promoter outside worktree
        shell: bash
        run: cp tools/tmp_promote_security_batch_dynamic.py /tmp/atlas-promote.py

      - name: Download trusted provider evidence
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.req.outputs.provider_artifact }}
          path: /tmp/provider-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cyber-sentinel/Cyber-Sentinel-Atlas
          run-id: ${{ env.DISCOVERY_RUN }}

      - name: Download trusted UWS membership evidence
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.UWS_ARTIFACT_NAME }}
          path: /tmp/uws-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cyber-sentinel/Cyber-Sentinel-Atlas
          run-id: ${{ env.UWS_RUN }}

      - name: Bind artifact metadata and raw checksums
        shell: bash
        env:
          BATCH: ${{ steps.req.outputs.batch }}
          PROVIDER_NAME: ${{ steps.req.outputs.provider_artifact }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DISCOVERY_RUN}/artifacts?per_page=100" > /tmp/discovery-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UWS_RUN}/artifacts?per_page=100" > /tmp/uws-artifacts.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=int(os.environ['BATCH']); pname=os.environ['PROVIDER_NAME']
          da=json.loads(Path('/tmp/discovery-artifacts.json').read_text())['artifacts']
          ua=json.loads(Path('/tmp/uws-artifacts.json').read_text())['artifacts']
          pmeta=next(x for x in da if x['name']==pname)
          umeta=next(x for x in ua if x['name']==os.environ['UWS_ARTIFACT_NAME'])
          pfile=Path('/tmp/provider-evidence')/f'security-auditing-batch{b}.json'
          ufile=Path('/tmp/uws-evidence')/'uws-batches22-35-verification.json'
          assert pfile.exists() and ufile.exists()
          praw='sha256-'+hashlib.sha256(pfile.read_bytes()).hexdigest()
          u=json.loads(ufile.read_text()); ub=u['batches'][str(b)]
          evidence={
            'batch':b,'discovery_run_id':int(os.environ['DISCOVERY_RUN']),
            'provider_artifact_id':pmeta['id'],'provider_artifact_digest':pmeta['digest'],'provider_raw_sha256':praw,
            'uws_run_id':int(os.environ['UWS_RUN']),'uws_artifact_id':umeta['id'],'uws_artifact_digest':umeta['digest'],'uws_raw_sha256':u['raw_sha256'],
            'uws_listed_ids':ub['listed_ids'],'uws_not_listed_ids':ub['not_listed_ids']
          }
          Path('/tmp/batch-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,separators=(',',':')))
          PY

      - name: Fresh-main and duplicate-work gate
        shell: bash
        env:
          BATCH: ${{ steps.req.outputs.batch }}
          IDS: ${{ steps.req.outputs.ids }}
          BRANCH: ${{ steps.req.outputs.branch }}
          EXPECTED_BEFORE: ${{ steps.req.outputs.expected_before }}
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test -z "$(git ls-remote --heads origin "refs/heads/${BRANCH}")"
          gh pr list --state open --json number,headRefName,title > /tmp/open-prs.json
          python3 - <<'PY'
          import json,os,subprocess
          prs=json.load(open('/tmp/open-prs.json')); assert prs==[],prs
          snap=json.loads(subprocess.check_output(['git','show','origin/main:content/encyclopedia/windows-security-auditing-26100.33296-coverage.snapshot.json'],text=True))
          before=int(os.environ['EXPECTED_BEFORE']); assert snap['encyclopedia_grade_count']==before,(snap['encyclopedia_grade_count'],before)
          ids=[int(x) for x in os.environ['IDS'].split(',')]
          next10=[int(x['event_id']) for x in snap['events'] if x['coverage_state']=='IDENTIFIED_PROVIDER_SCOPE'][:10]
          assert next10==ids,(next10,ids)
          print('fresh-main='+subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip())
          print('queue='+','.join(map(str,next10)))
          PY

      - name: Rebuild content branch from fresh main
        shell: bash
        env:
          BATCH: ${{ steps.req.outputs.batch }}
          IDS: ${{ steps.req.outputs.ids }}
          BRANCH: ${{ steps.req.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -C "$BRANCH" origin/main
          python3 /tmp/atlas-promote.py --batch "$BATCH" --artifact "/tmp/provider-evidence/security-auditing-batch${BATCH}.json" --evidence /tmp/batch-evidence.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=int(os.environ['BATCH']); ids=set(os.environ['IDS'].split(',')); listed=set(map(str,json.load(open('/tmp/batch-evidence.json'))['uws_listed_ids']))
          sources={json.loads(x.read_text())['id'] for x in Path('content/encyclopedia/sources').glob('*.json')}
          events=json.loads(Path('content/encyclopedia/approved-exemplars.json').read_text())['events']
          current=[x for x in events if str(x.get('native_event_id')) in ids and x.get('namespace')=='microsoft.windows.security']
          assert len(current)==10
          for e in current:
              assert e['source_id'] in sources and e['structural_source']['source_id'] in sources
              eid=str(e['native_event_id']); ext=e.get('external_reference')
              if eid in listed:
                  assert ext and ext['source_id'] in sources and 'ultimatewindowssecurity.com' in ext['url']
              else:
                  assert ext is None,(eid,ext)
          print('source-reference-integrity=PASS')
          PY

          python3 - <<'PY'
          import importlib.util,os
          from pathlib import Path
          b=int(os.environ['BATCH'])
          paths=[Path('tests/phase51010/test_windows_security_coverage_snapshot.py'),Path(f'tests/phase51010/test_windows_security_auditing_batch{b}.py')]
          prev=Path(f'tests/phase51010/test_windows_security_auditing_batch{b-1}.py')
          if prev.exists():paths.append(prev)
          for idx,path in enumerate(paths):
              spec=importlib.util.spec_from_file_location(f'bounded_{idx}',path); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              tests=[getattr(mod,n) for n in sorted(dir(mod)) if n.startswith('test_') and callable(getattr(mod,n))]
              assert tests,path
              for t in tests:t()
              print(f'PASS {path} ({len(tests)} tests)')
          PY

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$|^tmp/|^tools/tmp_' ; then
            echo 'Temporary/cache artifact leaked into content branch' >&2; exit 1
          fi
          git commit -m "Content: promote Security-Auditing Batch ${BATCH}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "branch=${BRANCH} head=$(git rev-parse HEAD) changed=$(git diff --name-only origin/main...HEAD | wc -l)"
