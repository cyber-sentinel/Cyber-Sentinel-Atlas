name: Temporary harden provider field key normalization

on:
  push:
    branches:
      - build/parallel-discovery-batches-14-19
    paths:
      - '.github/workflows/tmp-harden-field-key-normalization.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Harden canonical provider field keys and retrigger Batch 17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/tmp_parallel_promote_14_18.py')
          s=p.read_text(encoding='utf-8')
          old="def kebab(n): return re.sub(r'([a-z0-9])([A-Z])',r'\\1-\\2',n).replace('_','-').lower()"
          new="def kebab(n):\n s=re.sub(r'([a-z0-9])([A-Z])',r'\\1-\\2',n)\n s=re.sub(r'[^A-Za-z0-9]+','-',s)\n return s.strip('-').lower()"
          assert s.count(old)==1, 'expected exactly one legacy kebab implementation'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          compile(s,str(p),'exec')
          ns={'re':__import__('re')}
          exec(new,ns)
          assert ns['kebab']('TGT Lifetime')=='tgt-lifetime'
          assert ns['kebab']('IpAddress')=='ip-address'
          assert ns['kebab']('Foo_Bar / Baz')=='foo-bar-baz'

          q=Path('tmp/security-batch-request.json')
          req=json.loads(q.read_text(encoding='utf-8'))
          assert req['batch']==17
          assert req['ids']==[4820,4821,4822,4823,4824,4825,4826,4830,4864,4865]
          q.write_text(json.dumps(req,separators=(',',':'))+'\n',encoding='utf-8')
          print('field-key-normalization-hardening=PASS')
          PY
          git rm .github/workflows/tmp-harden-field-key-normalization.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/tmp_parallel_promote_14_18.py tmp/security-batch-request.json
          git diff --cached --check
          git commit -m 'Build: harden provider field canonical keys'
          git push origin "HEAD:${GITHUB_REF_NAME}"
