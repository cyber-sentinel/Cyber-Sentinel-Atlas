name: Phase 5.3.4 Canaries
on:
  pull_request:
    paths:
      - "ingestion/**"
      - "schemas/ingestion/**"
      - "fixtures/phase-5.3/**"
      - "tools/ingestion/**"
      - "tests/phase53/**"
      - ".github/workflows/phase534-canaries.yml"
  push:
    branches:
      - main
      - "feature/phase-5.3.4-*"
permissions:
  contents: read
jobs:
  validate-phase534:
    runs-on: [self-hosted, linux, x64, atlas-ci, atlas-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt
      - name: Validate Phase 5.3.4 offline contracts and promotion scenarios
        run: python tools/ingestion/validate_phase534.py
      - name: Run focused Phase 5.3.4 tests
        run: python -m unittest discover -s tests/phase53 -p "test_phase534.py" -v
      - name: Run pinned D3FEND live canary
        run: python tools/ingestion/run_d3fend_live_canary.py
      - name: Run commit-pinned CAR live canary
        run: python tools/ingestion/run_car_live_canary.py
