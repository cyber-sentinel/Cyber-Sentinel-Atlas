name: Temporary harden empty provider templates

on:
  push:
    branches:
      - build/parallel-discovery-batches-14-19
    paths:
      - '.github/workflows/tmp-harden-empty-provider-template.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Preserve valid zero-field provider definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/tmp_parallel_promote_14_18.py')
          s=p.read_text()
          old="  e=str(r['id']);root=ET.fromstring(r['template']);f=[(x.attrib['name'],x.attrib.get('inType'),x.attrib.get('outType')) for x in root.findall('e:data',ns)];s[e].append({'version':int(r['version']),'level':r.get('level'),'fields':f});t.setdefault(e,title(r.get('description'),e))"
          new="  e=str(r['id']);tmpl=r.get('template') or '';root=ET.fromstring(tmpl) if tmpl.strip() else None;f=[] if root is None else [(x.attrib['name'],x.attrib.get('inType'),x.attrib.get('outType')) for x in root.findall('e:data',ns)];s[e].append({'version':int(r['version']),'level':r.get('level'),'fields':f});t.setdefault(e,title(r.get('description'),e))"
          assert s.count(old)==1, 'expected provider-template parser anchor not found exactly once'
          s=s.replace(old,new)
          compile(s,str(p),'exec')
          p.write_text(s)
          print('empty-provider-template-policy=ZERO_FIELD_SHAPE')
          PY

      - name: Self-remove and commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-harden-empty-provider-template.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/tmp_parallel_promote_14_18.py
          git diff --cached --check
          git commit -m 'Build: preserve empty provider templates as zero-field shapes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
