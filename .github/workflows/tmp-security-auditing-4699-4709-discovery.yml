name: Temporary Security-Auditing 4699-4709 discovery

on:
  push:
    branches:
      - content/windows-security-auditing-batch-07-4699-4709
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-provider-metadata:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Capture bounded Security-Auditing provider metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = @(4699,4700,4701,4702,4703,4704,4705,4706,4707,4709)
          $providerName = 'Microsoft-Windows-Security-Auditing'
          $provider = Get-WinEvent -ListProvider $providerName
          $selected = @($provider.Events | Where-Object { $ids -contains [int]$_.Id } | Sort-Object Id, Version)
          $present = @($selected | ForEach-Object { [int]$_.Id } | Sort-Object -Unique)
          $missing = @($ids | Where-Object { $_ -notin $present })
          if ($missing.Count -gt 0) {
            throw "Provider identity set mismatch. Missing=$($missing -join ',') actual=$($present -join ',')"
          }
          $os = Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          $records = foreach ($event in $selected) {
            [ordered]@{
              id = [int]$event.Id
              version = [int]$event.Version
              provider = $providerName
              log_links = @($event.LogLink | ForEach-Object { $_.LogName })
              level = if ($event.Level) { $event.Level.Name } else { $null }
              task = if ($event.Task) { $event.Task.Name } else { $null }
              opcode = if ($event.Opcode) { $event.Opcode.Name } else { $null }
              keywords = @($event.Keywords | ForEach-Object { $_.Name })
              template = $event.Template
            }
          }
          [ordered]@{
            schema = 'atlas.windows-provider-structural-discovery/v1'
            structural_only = $true
            captured_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            runner_os = $os
            provider = $providerName
            channel_scope = 'Security'
            requested_ids = $ids
            unique_event_id_count = $present.Count
            event_version_definition_count = $selected.Count
            events = @($records)
          } | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 security-auditing-4699-4709.json
          Get-FileHash security-auditing-4699-4709.json -Algorithm SHA256 | Format-List
          Get-Content security-auditing-4699-4709.json

      - name: Upload bounded discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-auditing-4699-4709-provider-metadata
          path: security-auditing-4699-4709.json
          if-no-files-found: error
          retention-days: 7
