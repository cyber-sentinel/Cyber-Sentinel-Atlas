name: Post-4769 state synchronization

on:
  push:
    branches:
      - docs/sync-state-after-4769-queue
    paths:
      - .github/workflows/state-sync-after-4769.yml

permissions:
  contents: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sync-state-after-4769-queue
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Synchronize authoritative state documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          project = Path('docs/project-state.md')
          p = project.read_text(encoding='utf-8')
          old_sha = '- Last Reviewed Main SHA: `6de84bf13010ca869587eaa49ef24ce5017bad07`'
          new_sha = '- Last Reviewed Main SHA: `689b0250664e92d288a117af2c26b26e11fae5a8`'
          old_base = '- Latest reviewed merged corpus baseline: `9d54501bd3d7013637d7e83c9174d3f91a683aac` — PR #148 promoted Event 4768; Windows Security is `8/423` with `415` remaining on merged `main`. This branch proposes Event 4769 as the next encyclopedia-grade increment, producing `9/423` with `414` remaining pending review and merge; Sysmon remains `30/30`.'
          new_base = '- Latest reviewed merged corpus baseline: `14a80d0b1d830a207d3d77d0ffc4bae07599524c` — PR #153 promoted Windows Security Event 4769 after exact-head CI completed successfully; Windows Security is `9/423` with `414` remaining and Sysmon remains `30/30`.'
          for old, new in ((old_sha, new_sha), (old_base, new_base)):
              if p.count(old) != 1:
                  raise SystemExit(f'project-state expected exactly one match: {old[:80]}')
              p = p.replace(old, new, 1)
          marker = new_base + '\n'
          additions = (
              '- PR #149 documentation hub refresh — **MERGED**.\n'
              '- PR #150 public documentation / CI reporting consistency — **MERGED / EXACT-HEAD CI GREEN**.\n'
              '- PR #151 supply-chain scope detection fail-closed hardening — **MERGED / POST-MERGE CI GREEN**.\n'
              '- PR #152 deterministic Windows Security review queue — **MERGED / EXACT-HEAD CI GREEN** as `689b0250664e92d288a117af2c26b26e11fae5a8`; planning is bound to the frozen inventory and exact coverage snapshot and has no promotion/execution authority.\n'
              '- PR #153 Windows Security Event 4769 encyclopedia promotion — **MERGED / EXACT-HEAD CI GREEN** as `14a80d0b1d830a207d3d77d0ffc4bae07599524c`; coverage is `9/423`.\n'
          )
          if 'PR #153 Windows Security Event 4769 encyclopedia promotion' not in p:
              p = p.replace(marker, marker + additions, 1)
          project.write_text(p, encoding='utf-8')

          current = Path('docs/current-status.md')
          c = current.read_text(encoding='utf-8')
          old = '- Reviewed `main` corpus baseline: `9d54501bd3d7013637d7e83c9174d3f91a683aac` — PR #148 promoted Event 4768 after all nine exact-head workflows completed **SUCCESS**. Windows Security is `8/423` with `415` remaining; Sysmon remains `30/30`. This branch proposes Event 4769 as the next increment; branch coverage becomes `9/423` with `414` remaining pending review and merge.'
          new = '- Reviewed `main` corpus baseline: `14a80d0b1d830a207d3d77d0ffc4bae07599524c` — PR #153 promoted Event 4769 after all exact-head workflows completed **SUCCESS**. Windows Security is `9/423` with `414` remaining; Sysmon remains `30/30`. PR #152 subsequently merged deterministic bounded review planning as `689b0250664e92d288a117af2c26b26e11fae5a8` without changing coverage.'
          if c.count(old) != 1:
              raise SystemExit('current-status stale corpus baseline was not uniquely found')
          c = c.replace(old, new, 1)
          if 'PR #153 Windows Security Event 4769 encyclopedia promotion' not in c:
              c = c.replace(new + '\n', new + '\n- PR #152 deterministic Windows Security review queue — **MERGED / EXACT-HEAD CI GREEN**; planning-only, fail-closed, inventory/snapshot-bound.\n- PR #153 Windows Security Event 4769 encyclopedia promotion — **MERGED / EXACT-HEAD CI GREEN**; Windows Security advanced to `9/423`.\n', 1)
          current.write_text(c, encoding='utf-8')
          PY

          git diff --check -- docs/project-state.md docs/current-status.md

      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add docs/project-state.md docs/current-status.md
          changed="$(git diff --cached --name-only)"
          expected=$'docs/current-status.md\ndocs/project-state.md'
          test "$changed" = "$expected"
          git diff --cached --check
          git commit -m 'Docs: synchronize post-4769 authoritative state'
          git push origin HEAD:docs/sync-state-after-4769-queue
