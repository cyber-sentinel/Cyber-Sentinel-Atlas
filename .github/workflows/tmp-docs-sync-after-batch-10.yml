name: Temporary docs sync after Batch 10
on:
  push:
    branches:
      - docs/sync-coverage-after-batch-10
permissions:
  contents: write
jobs:
  sync-docs:
    if: contains(github.event.head_commit.message, 'Run bounded docs sync after Batch 10')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply bounded documentation sync
        run: python tools/tmp_sync_docs_after_batch10.py
      - name: Validate coverage and queue
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python tools/content/validate_encyclopedia_coverage.py
          python tools/content/build_windows_security_review_queue.py --batch-size 10 --batch-index 0 >/tmp/queue.json
      - name: Commit exactly nine documentation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/README.md docs/current-status.md docs/product-surfaces.md docs/project-state.md docs/roadmap.md docs/windows-sysmon-coverage-plan.md ingestion/README.md ingestion/source-profiles/README.md
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit -m 'Docs: synchronize coverage after PR #174'
          git push origin HEAD:docs/sync-coverage-after-batch-10
