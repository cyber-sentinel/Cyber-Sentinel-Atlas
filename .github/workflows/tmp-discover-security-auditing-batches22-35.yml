name: Temporary discover Security-Auditing Batches 22-35

on:
  push:
    branches:
      - build/security-auditing-batches-22-35
    paths:
      - '.github/workflows/tmp-discover-security-auditing-batches22-35.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Derive Batches 22-35 from exact frozen provider queue
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          python3 - <<'PY'
          import json, os, subprocess
          expected_main='a19dfb19e044f05483e5b1934c447786022eae92'
          actual=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          assert actual==expected_main,(actual,expected_main)
          raw=subprocess.check_output(['git','show','origin/main:content/encyclopedia/windows-security-auditing-26100.33296-coverage.snapshot.json'],text=True)
          snap=json.loads(raw)
          assert snap['denominator_count']==423
          assert snap['encyclopedia_grade_count']==210
          candidates=[int(x['event_id']) for x in snap['events'] if x['coverage_state']=='IDENTIFIED_PROVIDER_SCOPE']
          selected=candidates[:140]
          assert len(selected)==140, len(selected)
          rows=[]
          for i,batch in enumerate(range(22,36)):
              ids=selected[i*10:(i+1)*10]
              assert len(ids)==10
              rows.append({'batch':batch,'ids':','.join(map(str,ids)),'first':ids[0],'last':ids[-1]})
          plan={'schema':'atlas.security-auditing-batches22-35-plan/v1','base_main':actual,'base_provider_coverage':'210/423','batches':rows}
          open('security-auditing-batches22-35-plan.json','w').write(json.dumps(plan,indent=2)+'\n')
          matrix=json.dumps({'include':rows},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+matrix+'\n')
          print(json.dumps(plan,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: security-auditing-batches22-35-plan
          path: security-auditing-batches22-35-plan.json
          if-no-files-found: error
          retention-days: 14

  provider-discovery:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Capture exact provider metadata
        shell: pwsh
        env:
          BATCH: ${{ matrix.batch }}
          IDS: ${{ matrix.ids }}
        run: |
          $ErrorActionPreference='Stop'
          $batch=[int]$env:BATCH
          $ids=@($env:IDS.Split(',') | ForEach-Object {[int]$_})
          if($ids.Count -ne 10){throw "Expected 10 IDs, got $($ids.Count)"}
          $providerName='Microsoft-Windows-Security-Auditing'
          $provider=Get-WinEvent -ListProvider $providerName
          $selected=@($provider.Events | Where-Object {$ids -contains [int]$_.Id} | Sort-Object Id,Version)
          $present=@($selected | ForEach-Object {[int]$_.Id} | Sort-Object -Unique)
          $missing=@($ids | Where-Object {$_ -notin $present})
          if($missing.Count -gt 0 -or $present.Count -ne 10){throw "Provider identity mismatch missing=$($missing -join ',') actual=$($present -join ',')"}
          $os=Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture
          if([string]$os.OsBuildNumber -ne '26100'){throw "Expected build 26100, got $($os.OsBuildNumber)"}
          $records=foreach($event in $selected){
            [ordered]@{
              id=[int]$event.Id
              version=[int]$event.Version
              provider=$providerName
              log_links=@($event.LogLink | ForEach-Object {$_.LogName})
              level=if($event.Level){$event.Level.Name}else{$null}
              task=if($event.Task){$event.Task.Name}else{$null}
              opcode=if($event.Opcode){$event.Opcode.Name}else{$null}
              keywords=@($event.Keywords | ForEach-Object {$_.Name})
              description=$event.Description
              template=$event.Template
            }
          }
          $path="security-auditing-batch$batch.json"
          [ordered]@{
            schema='atlas.windows-provider-structural-discovery/v2'
            structural_only=$false
            provider_message_semantics=$true
            batch=$batch
            captured_at_utc=(Get-Date).ToUniversalTime().ToString('o')
            runner_os=$os
            provider=$providerName
            channel_scope='Security'
            requested_ids=$ids
            unique_event_id_count=$present.Count
            event_version_definition_count=$selected.Count
            events=@($records)
          } | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 $path
          $sha=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "batch=$batch ids=$($ids -join ',') raw_sha256=$sha unique_ids=$($present.Count) versions=$($selected.Count)"
      - uses: actions/upload-artifact@v4
        with:
          name: security-auditing-batch${{ matrix.batch }}-provider-metadata-v2
          path: security-auditing-batch${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 14

  uws-verification:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify UWS membership for all planned identities
        shell: bash
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request
          rows=json.loads(os.environ['MATRIX'])['include']
          url='https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/default.aspx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ATLAS-Controlled-Review/1.0'})
          raw=urllib.request.urlopen(req,timeout=30).read()
          text=raw.decode('utf-8','replace')
          listed={int(x) for x in re.findall(r'event(?:\\.aspx)?\\?eventid=(\\d+)',text,re.I)}
          if len(listed)<400:
              listed.update(int(x) for x in re.findall(r'eventid[=:\\"\\\'\\s]+(\\d{3,5})',text,re.I))
          assert len(listed)>=400,len(listed)
          batches={}
          for row in rows:
              ids=[int(x) for x in row['ids'].split(',')]
              yes=[x for x in ids if x in listed]
              no=[x for x in ids if x not in listed]
              batches[str(row['batch'])]={'ids':ids,'listed_ids':yes,'not_listed_ids':no,'listed_count':len(yes)}
          evidence={'schema':'atlas.uws-batches22-35-membership/v1','source_url':url,'retrieved_unique_ids':len(listed),'raw_sha256':'sha256-'+hashlib.sha256(raw).hexdigest(),'batches':batches}
          open('uws-batches22-35-verification.json','w').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uws-batches22-35-verification
          path: uws-batches22-35-verification.json
          if-no-files-found: error
          retention-days: 14
