name: Event 4769 content maintenance

on:
  push:
    branches:
      - feature/windows-security-event-4769
    paths:
      - .github/workflows/event4769-content-maintenance.yml

permissions:
  contents: write

jobs:
  update-event-4769:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/windows-security-event-4769
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Align bootstrap with verified repository state
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/inventory\["items"\]/inventory["entries"]/g' tools/content/_event4769_bootstrap.py
          sed -i 's/FIXED_TIME = "2026-10-05T09:00:00Z"/FIXED_TIME = "2026-10-04T11:10:00Z"/' tools/content/_event4769_bootstrap.py

      - name: Apply bounded Event 4769 content increment
        run: python tools/content/_event4769_bootstrap.py

      - name: Align generated version assertion with existing test helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/phase51010/test_approved_exemplar_content.py')
          text = path.read_text(encoding='utf-8')
          old = '    event = next(item for item in load_blueprint()["events"] if item["native_event_id"] == "4769")'
          new = '    event = next(item for item in json.loads((ROOT / "content/encyclopedia/approved-exemplars.json").read_text(encoding="utf-8"))["events"] if item["native_event_id"] == "4769")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Event 4769 version assertion marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate Event 4769 content increment
        shell: bash
        run: |
          set -euo pipefail
          python tests/phase51010/test_windows_security_coverage_snapshot.py
          python tests/phase51010/test_approved_exemplar_content.py
          python tools/content/build_encyclopedia_records.py --output /tmp/atlas-encyclopedia-records.jsonl
          python -m py_compile tools/content/build_encyclopedia_records.py tools/release/build_engineering_preview_pack.py tools/release/probe_engineering_preview.py
          git diff --check

      - name: Commit validated non-workflow content increment
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/phase5105-usable-data-preview.yml
          rm -f tools/content/_event4769_bootstrap.py
          find tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find tools -type f -name '*.pyc' -delete
          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo 'Refusing runner-side workflow mutation'
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo 'Refusing generated Python cache artifacts'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Content: add Windows Security Event 4769'
          git push origin HEAD:feature/windows-security-event-4769
