name: Event 4769 content maintenance

on:
  push:
    branches:
      - feature/windows-security-event-4769
    paths:
      - .github/workflows/event4769-content-maintenance.yml

permissions:
  contents: write

jobs:
  update-event-4769:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/windows-security-event-4769
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Align bootstrap with verified repository state
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/inventory\["items"\]/inventory["entries"]/g' tools/content/_event4769_bootstrap.py
          sed -i 's/FIXED_TIME = "2026-10-05T09:00:00Z"/FIXED_TIME = "2026-10-04T11:10:00Z"/' tools/content/_event4769_bootstrap.py

      - name: Apply bounded Event 4769 content increment
        run: python tools/content/_event4769_bootstrap.py

      - name: Validate Event 4769 content increment
        shell: bash
        run: |
          set -euo pipefail
          python tests/phase51010/test_windows_security_coverage_snapshot.py
          python tests/phase51010/test_approved_exemplar_content.py
          python tools/content/build_encyclopedia_records.py --output /tmp/atlas-encyclopedia-records.jsonl
          python -m py_compile tools/content/build_encyclopedia_records.py tools/release/build_engineering_preview_pack.py tools/release/probe_engineering_preview.py
          git diff --check

      - name: Commit validated Event 4769 increment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/event4769-content-maintenance.yml tools/content/_event4769_bootstrap.py
          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Content: add Windows Security Event 4769'
          git push origin HEAD:feature/windows-security-event-4769
