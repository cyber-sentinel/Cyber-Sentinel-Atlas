name: Temporary README sync after Batch 12

on:
  push:
    branches:
      - docs/sync-readme-after-batch-12
    paths:
      - '.github/workflows/tmp-sync-readme-batch12.yml'

permissions:
  contents: write

jobs:
  sync-readmes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Synchronize human-readable Batch 12 coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          lines = text.splitlines()
          idx = [i for i,line in enumerate(lines) if line.startswith('| Windows Security Auditing |')]
          assert len(idx) == 1, idx
          i = idx[0]
          line = lines[i]
          assert '| 110 —' in line and line.endswith('| 313 |'), line
          assert '`4752`, `4768`' in line, 'expected Batch 11 tail anchor not found'
          batch12 = ', '.join(f'`{x}`' for x in range(4753, 4763))
          line = line.replace('| 110 —', '| 120 —', 1)
          line = line.replace('`4752`, `4768`', f'`4752`, {batch12}, `4768`', 1)
          line = line[:-len('| 313 |')] + '| 303 |'
          lines[i] = line
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          old = 'The cross-provider Windows Security Log **Ultimate Windows Security (UWS) review benchmark** is currently **116/422** listed Event IDs (**27.49%**), with **306** remaining.'
          new = 'The cross-provider Windows Security Log **Ultimate Windows Security (UWS) review benchmark** is currently **126/422** listed Event IDs (**29.86%**), with **296** remaining.'
          assert text.count(old) == 1
          root.write_text(text.replace(old, new), encoding='utf-8')

          ing = Path('ingestion/README.md')
          t = ing.read_text(encoding='utf-8')
          old = 'Current reviewed `main` coverage is **110/423** encyclopedia-grade Event IDs for `Microsoft-Windows-Security-Auditing`, while the cross-provider Security Log UWS review benchmark is **116/422** and Sysmon 15.22 remains **30/30** complete.'
          new = 'Current reviewed `main` coverage is **120/423** encyclopedia-grade Event IDs for `Microsoft-Windows-Security-Auditing`, while the cross-provider Security Log UWS review benchmark is **126/422** and Sysmon 15.22 remains **30/30** complete.'
          assert t.count(old) == 1
          ing.write_text(t.replace(old, new), encoding='utf-8')

          assert '| 120 —' in root.read_text(encoding='utf-8')
          assert '**126/422**' in root.read_text(encoding='utf-8')
          assert '**120/423**' in ing.read_text(encoding='utf-8')
          assert '**126/422**' in ing.read_text(encoding='utf-8')
          print('README coverage sync=PASS')
          PY

      - name: Remove temporary workflow and commit docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-readme-batch12.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md ingestion/README.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -Fx README.md
          git diff --cached --name-only | grep -Fx ingestion/README.md
          git diff --cached --name-only | grep -Fx .github/workflows/tmp-sync-readme-batch12.yml
          git commit -m 'Docs: synchronize README coverage after Batch 12'
          git push origin "HEAD:${GITHUB_REF_NAME}"
