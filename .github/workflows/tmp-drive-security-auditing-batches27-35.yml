name: Temporary drive Security-Auditing Batches 27-35

on:
  push:
    branches:
      - build/security-auditing-batches-22-35
    paths:
      - '.github/workflows/tmp-drive-security-auditing-batches27-35.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive bounded fresh-main promotion sequence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          CONTROL_BRANCH='build/security-auditing-batches-22-35'
          CONTROL_PATH='tmp/security-batch-request-22-35.json'
          REQUIRED='Foundation Hygiene|Phase 5.3.4 Canaries|Phase 5.10 Public Preview Readiness|Phase 5.10.1 Redistribution Closure|Governance Hygiene|Phase 5.5.4D Supply Chain Closure'

          batch_ids() {
            case "$1" in
              27) echo '5029,5030,5031,5032,5033,5034,5035,5037,5038,5039' ;;
              28) echo '5040,5041,5042,5043,5044,5045,5046,5047,5048,5049' ;;
              29) echo '5050,5051,5056,5057,5058,5059,5060,5061,5062,5063' ;;
              30) echo '5064,5065,5066,5067,5068,5069,5070,5071,5120,5121' ;;
              31) echo '5122,5123,5124,5125,5126,5127,5136,5137,5138,5139' ;;
              32) echo '5140,5141,5142,5143,5144,5145,5146,5147,5148,5149' ;;
              33) echo '5150,5151,5152,5153,5154,5155,5156,5157,5158,5159' ;;
              34) echo '5160,5168,5169,5170,5376,5377,5378,5379,5380,5381' ;;
              35) echo '5382,5440,5441,5442,5443,5444,5446,5447,5448,5449' ;;
              *) return 1 ;;
            esac
          }

          coverage_count() {
            gh api "repos/${REPO}/contents/content/encyclopedia/windows-security-auditing-26100.33296-coverage.snapshot.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d | jq -r '.encyclopedia_grade_count'
          }

          uws_count() {
            gh api "repos/${REPO}/contents/content/encyclopedia/coverage-manifest.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d | jq -r '.windows_security_log_review_benchmark.encyclopedia_grade_listed_id_count'
          }

          wait_rebuild() {
            local control_commit="$1"
            for _ in $(seq 1 180); do
              gh api "repos/${REPO}/actions/runs?head_sha=${control_commit}&per_page=20" > /tmp/rebuild-runs.json
              read -r status conclusion run_id < <(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/rebuild-runs.json'))
          xs=[r for r in d.get('workflow_runs',[]) if r.get('name')=='Temporary rebuild Security-Auditing Batch 22-35 from fresh main']
          if not xs: print('missing null 0')
          else:
              r=max(xs,key=lambda x:x['id']);print(r['status'],r.get('conclusion') or 'null',r['id'])
          PY
              )
              echo "rebuild control=${control_commit} run=${run_id} status=${status} conclusion=${conclusion}"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] || { echo "rebuild failed run=${run_id} conclusion=${conclusion}" >&2; exit 1; }
                return 0
              fi
              sleep 5
            done
            echo 'rebuild timeout' >&2; exit 1
          }

          wait_gates() {
            local head="$1"
            for _ in $(seq 1 480); do
              gh api "repos/${REPO}/actions/runs?head_sha=${head}&event=pull_request&per_page=100" > /tmp/pr-runs.json
              state=$(python3 - <<'PY'
          import json
          req={'Foundation Hygiene','Phase 5.3.4 Canaries','Phase 5.10 Public Preview Readiness','Phase 5.10.1 Redistribution Closure','Governance Hygiene','Phase 5.5.4D Supply Chain Closure'}
          d=json.load(open('/tmp/pr-runs.json'))
          latest={}
          for r in d.get('workflow_runs',[]):
              n=r.get('name')
              if n in req and (n not in latest or r['id']>latest[n]['id']): latest[n]=r
          missing=sorted(req-set(latest))
          bad=[]; pending=[]
          for n,r in latest.items():
              if r.get('status')!='completed': pending.append(f"{n}:{r.get('status')}")
              elif r.get('conclusion')!='success': bad.append(f"{n}:{r.get('conclusion')}")
          if bad: print('FAIL '+','.join(sorted(bad)))
          elif missing or pending: print('PENDING missing='+','.join(missing)+' pending='+','.join(sorted(pending)))
          else: print('PASS')
          PY
              )
              echo "exact-head=${head} gates=${state}"
              case "$state" in
                PASS) return 0 ;;
                FAIL*) echo "$state" >&2; exit 1 ;;
              esac
              sleep 10
            done
            echo 'exact-head gate timeout' >&2; exit 1
          }

          cancel_redundant_main_push() {
            local sha="$1"
            sleep 3
            gh api "repos/${REPO}/actions/runs?branch=main&event=push&head_sha=${sha}&per_page=100" > /tmp/main-runs.json
            python3 - <<'PY' > /tmp/cancel-ids
          import json
          req={'Foundation Hygiene','Phase 5.3.4 Canaries','Phase 5.10 Public Preview Readiness','Phase 5.10.1 Redistribution Closure','Governance Hygiene','Phase 5.5.4D Supply Chain Closure'}
          d=json.load(open('/tmp/main-runs.json'))
          for r in d.get('workflow_runs',[]):
              if r.get('event')=='push' and r.get('head_branch')=='main' and r.get('name') in req and r.get('status') in {'queued','in_progress'}:
                  print(r['id'])
          PY
            while read -r id; do
              [ -n "$id" ] || continue
              echo "cancel redundant post-merge main push run=${id} sha=${sha}"
              gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null || true
            done < /tmp/cancel-ids
          }

          update_control() {
            local batch="$1" ids="$2" expected="$3"
            local blobsha content b64 response
            blobsha=$(gh api "repos/${REPO}/contents/${CONTROL_PATH}?ref=${CONTROL_BRANCH}" --jq '.sha')
            content=$(python3 - "$batch" "$ids" "$expected" <<'PY'
          import json,sys
          b=int(sys.argv[1]);ids=[int(x) for x in sys.argv[2].split(',')];expected=int(sys.argv[3])
          print(json.dumps({'batch':b,'ids':ids,'expected_provider_before':expected},indent=2))
          PY
            )
            b64=$(printf '%s\n' "$content" | base64 -w0)
            response=$(gh api -X PUT "repos/${REPO}/contents/${CONTROL_PATH}" -f message="Build: request Security-Auditing Batch ${batch}" -f content="$b64" -f sha="$blobsha" -f branch="$CONTROL_BRANCH")
            printf '%s' "$response" | jq -r '.commit.sha'
          }

          for batch in $(seq 27 35); do
            ids=$(batch_ids "$batch")
            first=${ids%%,*}; last=${ids##*,}
            expected=$((210 + 10 * (batch - 22)))
            target=$((expected + 10))
            branch="content/windows-security-auditing-batch-${batch}-${first}-${last}"
            echo "=== Batch ${batch} scope=${ids} expected_before=${expected} ==="

            main_count=$(coverage_count)
            [ "$main_count" -eq "$expected" ] || { echo "main coverage mismatch actual=${main_count} expected=${expected}" >&2; exit 1; }

            if [ "$batch" -gt 27 ]; then
              open_count=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --jq 'length')
              [ "$open_count" -eq 0 ] || { echo 'unexpected open PR before rebuild' >&2; gh api "repos/${REPO}/pulls?state=open&per_page=100" --jq '.[]|[.number,.head.ref,.title]|@tsv'; exit 1; }
              if gh api "repos/${REPO}/branches/${branch}" >/dev/null 2>&1; then echo "target branch already exists: ${branch}" >&2; exit 1; fi
              control_commit=$(update_control "$batch" "$ids" "$expected")
              echo "control commit=${control_commit}"
              wait_rebuild "$control_commit"
            fi

            gh api "repos/${REPO}/compare/main...${branch}" > /tmp/compare.json
            python3 - "$batch" <<'PY'
          import json,sys,re
          b=int(sys.argv[1]);d=json.load(open('/tmp/compare.json'))
          assert d['status']=='ahead' and d['ahead_by']==1 and d['behind_by']==0,(d['status'],d['ahead_by'],d['behind_by'])
          files=[x['filename'] for x in d.get('files',[])]
          assert len(files)==9,files
          assert not any(re.search(r'(^|/)__pycache__/|\.pyc$|^tmp/|^tools/tmp_',p) for p in files),files
          print(f'compare hygiene PASS batch={b} files={len(files)}')
          PY
            head=$(gh api "repos/${REPO}/branches/${branch}" --jq '.commit.sha')

            pr=$(gh api "repos/${REPO}/pulls?state=open&head=cyber-sentinel:${branch}&per_page=10" --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              actual_uws=$(gh api "repos/${REPO}/contents/content/encyclopedia/coverage-manifest.json?ref=${branch}" --jq '.content' | tr -d '\n' | base64 -d | jq -r '.windows_security_log_review_benchmark.encyclopedia_grade_listed_id_count')
              body=$(cat <<EOF
          Fresh-main Batch ${batch} promotion.

          Scope: \`${ids}\`.

          Evidence is bound to provider discovery run \`37826533823\` and controlled UWS verification run \`37826876988\`; artifact IDs, digests, raw checksums and per-version field shapes are recorded in the committed source/inventory evidence for this Batch.

          Pre-PR: fresh-main coverage \`${expected}/423\`, deterministic queue match, source-reference integrity, focused current/previous batch tests, coverage snapshot tests, temp/cache hygiene, \`ahead_by=1\`, \`behind_by=0\`, exactly nine durable changed files.

          Expected after merge: Security-Auditing \`${target}/423\`; UWS listed coverage \`${actual_uws}/422\`; Sysmon \`30/30\`.
          EOF
              )
              pr=$(gh api -X POST "repos/${REPO}/pulls" -f title="Content: promote Windows Security-Auditing Batch ${batch} (${first}-${last})" -f head="$branch" -f base='main' -f body="$body" --jq '.number')
              echo "created PR #${pr} head=${head}"
            else
              pr_head=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')
              [ "$pr_head" = "$head" ] || { echo "PR head mismatch pr=${pr_head} branch=${head}" >&2; exit 1; }
              echo "reuse PR #${pr} head=${head}"
            fi

            wait_gates "$head"
            mergeable=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.mergeable')
            [ "$mergeable" = true ] || { echo "PR #${pr} not mergeable" >&2; exit 1; }
            result=$(gh api -X PUT "repos/${REPO}/pulls/${pr}/merge" -f merge_method='squash' -f sha="$head" -f commit_title="Content: promote Windows Security-Auditing Batch ${batch} (${first}-${last}) (#${pr})")
            merged=$(printf '%s' "$result" | jq -r '.merged'); merge_sha=$(printf '%s' "$result" | jq -r '.sha')
            [ "$merged" = true ] || { echo "$result" >&2; exit 1; }
            echo "merged Batch ${batch} PR #${pr} main=${merge_sha}"

            head_tree=$(gh api "repos/${REPO}/commits/${head}" --jq '.commit.tree.sha')
            for _ in $(seq 1 30); do
              current=$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')
              [ "$current" = "$merge_sha" ] && break
              sleep 2
            done
            [ "$current" = "$merge_sha" ] || { echo "main did not advance to merge sha" >&2; exit 1; }
            main_tree=$(gh api "repos/${REPO}/commits/${merge_sha}" --jq '.commit.tree.sha')
            verified=$(gh api "repos/${REPO}/commits/${merge_sha}" --jq '.commit.verification.verified')
            [ "$head_tree" = "$main_tree" ] || { echo 'post-merge tree mismatch' >&2; exit 1; }
            [ "$verified" = true ] || { echo 'post-merge signature not verified' >&2; exit 1; }
            final_count=$(coverage_count)
            [ "$final_count" -eq "$target" ] || { echo "post-merge coverage mismatch actual=${final_count} target=${target}" >&2; exit 1; }
            echo "post-merge PASS batch=${batch} security=${final_count}/423 uws=$(uws_count)/422 signed=${verified}"
            cancel_redundant_main_push "$merge_sha"
          done

          echo 'BATCHES_27_35_COMPLETE=PASS'
