name: Temporary EventLog 1100-series batch validation

on:
  push:
    branches:
      - content/windows-security-eventlog-batch-01-1100-1108
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 jsonschema==4.25.1

      - name: Patch bounded validation assumptions
        run: python tools/tmp_patch_eventlog_1100_batch.py

      - name: Apply bounded 1100-series content batch
        run: python tools/tmp_apply_eventlog_1100_batch.py

      - name: Compile changed Python
        run: python -m py_compile tools/content/build_encyclopedia_records.py tools/content/validate_encyclopedia_coverage.py tests/phase51010/test_windows_security_eventlog_1100_series.py tests/phase51010/test_approved_exemplar_content.py

      - name: Validate coverage contract
        run: python tools/content/validate_encyclopedia_coverage.py

      - name: Validate canonical encyclopedia records and batch semantics
        run: >-
          python -m pytest -q
          tests/phase51010/test_windows_security_eventlog_1100_series.py
          tests/phase51010/test_approved_exemplar_content.py
          tests/phase51010/test_exemplar_driven_preview_contract.py

      - name: Build deterministic encyclopedia records
        run: |
          python tools/content/build_encyclopedia_records.py --output "$RUNNER_TEMP/encyclopedia-a.jsonl"
          python tools/content/build_encyclopedia_records.py --output "$RUNNER_TEMP/encyclopedia-b.jsonl"
          cmp "$RUNNER_TEMP/encyclopedia-a.jsonl" "$RUNNER_TEMP/encyclopedia-b.jsonl"
          sha256sum "$RUNNER_TEMP/encyclopedia-a.jsonl"

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit validated durable product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cyber-sentinel"
          git config user.email "118610577+cyber-sentinel@users.noreply.github.com"
          git add \
            content/encyclopedia/approved-exemplars.json \
            content/encyclopedia/coverage-manifest.json \
            content/encyclopedia/sources \
            ingestion/inventories/windows-eventlog-security-1100-series-26100.telemetry.json \
            tools/content/build_encyclopedia_records.py \
            tools/content/validate_encyclopedia_coverage.py \
            tests/phase51010/test_windows_security_eventlog_1100_series.py \
            tests/phase51010/test_approved_exemplar_content.py \
            docs/releases/third-party-redistribution-inventory.json \
            docs/windows-security-log-scope.md
          if git diff --cached --quiet; then
            echo "No durable product changes to commit"
            exit 1
          fi
          git commit -m "Content: add Windows Security EventLog 1100-series coverage"
          git push origin HEAD:content/windows-security-eventlog-batch-01-1100-1108
