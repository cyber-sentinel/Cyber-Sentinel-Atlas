name: Temporary Event 4608 bounded apply

on:
  push:
    branches:
      - content/windows-security-event-4608
    paths:
      - .github/workflows/tmp-event-4608-apply.yml

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/windows-security-event-4608
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply bounded Event 4608 content change
        run: python tools/tmp_apply_event_4608.py

      - name: Validate Event 4608 and coverage contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/phase51010/test_windows_security_coverage_snapshot.py
          python tests/phase51010/test_encyclopedia_coverage_manifest.py
          python tests/phase51010/test_windows_security_review_queue.py
          python tests/phase51010/test_approved_exemplar_content.py
          python tests/phase51010/test_exemplar_driven_preview_contract.py
          python -m py_compile tools/content/build_encyclopedia_records.py tools/content/build_windows_security_coverage_snapshot.py tools/content/build_windows_security_review_queue.py tools/release/build_engineering_preview_pack.py tools/release/probe_engineering_preview.py
          git diff --check

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add \
            content/encyclopedia/approved-exemplars.json \
            content/encyclopedia/coverage-manifest.json \
            content/encyclopedia/windows-security-auditing-26100.33296-coverage.snapshot.json \
            content/encyclopedia/sources/microsoft-windows-security-event-4608.json \
            content/encyclopedia/sources/ultimate-windows-security-event-4608.json \
            docs/releases/third-party-redistribution-inventory.json \
            tests/phase51010/test_approved_exemplar_content.py \
            tests/phase51010/test_windows_security_coverage_snapshot.py \
            tests/phase51010/test_windows_security_review_queue.py
          git diff --cached --check
          git commit -m 'Content: add Windows Security Event 4608 encyclopedia coverage'
          git push origin HEAD:content/windows-security-event-4608
