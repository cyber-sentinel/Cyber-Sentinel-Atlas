name: Temporary Batch 13 diff hygiene

on:
  push:
    branches:
      - content/windows-security-auditing-batch-13-4763-4775
    paths:
      - '.github/workflows/tmp-batch13-diff-hygiene.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore stable JSON ordering without semantic change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          ids={str(x) for x in (4763,4764,4765,4766,4767,4770,4772,4773,4774,4775)}
          def main(path): return json.loads(subprocess.check_output(['git','show',f'origin/main:{path}'],text=True))
          def cur(path): return json.loads(Path(path).read_text())
          def write(path,obj): Path(path).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          path='content/encyclopedia/windows-security-auditing-26100.33296-coverage.snapshot.json'
          m=main(path); c=cur(path)
          for k in ('encyclopedia_grade_count','remaining_count','completion_ratio','completion_percent'): m[k]=c[k]
          ce={str(x['event_id']):x for x in c['events']}
          for row in m['events']:
              if str(row['event_id']) in ids:
                  row.clear(); row.update(ce[str(row['event_id'])])
          assert m==c, 'snapshot semantic mismatch'
          write(path,m)
          path='content/encyclopedia/coverage-manifest.json'
          m=main(path); c=cur(path)
          mb=m['windows_security_log_review_benchmark']; cb=c['windows_security_log_review_benchmark']
          for k in ('covered_event_ids','encyclopedia_grade_listed_id_count','remaining_listed_id_count','completion_ratio','completion_percent'): mb[k]=cb[k]
          mf=next(x for x in m['families'] if x['id']=='windows-security-auditing'); cf=next(x for x in c['families'] if x['id']=='windows-security-auditing')
          for k in ('encyclopedia_grade_count','remaining_count'): mf[k]=cf[k]
          assert m==c, 'manifest semantic mismatch'
          write(path,m)
          print('semantic-equality=PASS')
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-batch13-diff-hygiene.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Chore: minimize Batch 13 JSON diff noise'
          git push origin "HEAD:${GITHUB_REF_NAME}"
