name: Phase 5.10.2 Signing Readiness

on:
  push:
    branches:
      - main
      - phase-5.10.2-signing-control-plane
    paths:
      - 'docs/releases/production-signing-and-key-custody.md'
      - 'docs/releases/production-signing-readiness.json'
      - 'tools/release/validate_production_signing.py'
      - 'tools/release/verify_windows_authenticode.ps1'
      - '.github/workflows/phase5102-signing-readiness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/releases/production-signing-and-key-custody.md'
      - 'docs/releases/production-signing-readiness.json'
      - 'tools/release/validate_production_signing.py'
      - 'tools/release/verify_windows_authenticode.ps1'
      - '.github/workflows/phase5102-signing-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate PPR-05 signing control plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate PPR-05 control plane
        run: python tools/release/validate_production_signing.py
      - name: Parse provider-neutral Authenticode verifier
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'tools/release/verify_windows_authenticode.ps1',
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
