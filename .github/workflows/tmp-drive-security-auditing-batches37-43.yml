name: Temporary drive Security-Auditing Batches 37-43

on:
  push:
    branches:
      - build/security-auditing-batches-36-43
    paths:
      - '.github/workflows/tmp-drive-security-auditing-batches37-43.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: security-auditing-batches37-43-driver
  cancel-in-progress: false

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQ_PATH: tmp/security-batch-request-36-43.json
      ORCH_BRANCH: build/security-auditing-batches-36-43
    steps:
      - name: Drive bounded fresh-main promotion sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, time

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          req_path=os.environ['REQ_PATH']
          orch=os.environ['ORCH_BRANCH']
          env={**os.environ,'GH_TOKEN':token}

          scopes={
            37:[5462,5463,5464,5465,5466,5467,5468,5471,5472,5473],
            38:[5474,5477,5478,5479,5480,5483,5484,5485,5632,5633],
            39:[5712,5888,5889,5890,6144,6145,6272,6273,6274,6275],
            40:[6276,6277,6278,6279,6280,6281,6400,6401,6402,6403],
            41:[6404,6405,6406,6407,6408,6409,6410,6416,6417,6418],
            42:[6419,6420,6421,6422,6423,6424,6425,6426,6427,6428],
            43:[6429,6430,8191],
          }
          required={
            'Foundation Hygiene',
            'Phase 5.3.4 Canaries',
            'Governance Hygiene',
            'Phase 5.10 Public Preview Readiness',
            'Phase 5.10.1 Redistribution Closure',
            'Phase 5.5.4D Supply Chain Closure',
          }

          def gh(path, method='GET', fields=None):
              cmd=['gh','api']
              if method!='GET': cmd += ['-X',method]
              cmd.append(path)
              for k,v in (fields or {}).items():
                  cmd += ['-f',f'{k}={v}']
              out=subprocess.check_output(cmd,env=env,text=True)
              return json.loads(out) if out.strip() else None

          def raw_content(path, ref='main'):
              x=gh(f'repos/{repo}/contents/{path}?ref={ref}')
              return base64.b64decode(x['content']).decode()

          def coverage():
              m=json.loads(raw_content('content/encyclopedia/coverage-manifest.json','main'))
              fam=next(x for x in m['families'] if x['id']=='windows-security-auditing')
              return int(fam['encyclopedia_grade_count']), int(fam['remaining_count'])

          def branch_sha(branch):
              try:
                  return gh(f'repos/{repo}/git/ref/heads/{branch}')['object']['sha']
              except subprocess.CalledProcessError:
                  return None

          def find_open_pr(branch):
              prs=gh(f'repos/{repo}/pulls?state=open&head=cyber-sentinel:{branch}&per_page=20')
              return prs[0] if prs else None

          def wait_branch(branch, timeout=900):
              end=time.time()+timeout
              while time.time()<end:
                  sha=branch_sha(branch)
                  if sha: return sha
                  time.sleep(10)
              raise RuntimeError(f'timeout waiting for branch {branch}')

          def update_request(batch,ids,before):
              cur=gh(f'repos/{repo}/contents/{req_path}?ref={orch}')
              body=json.dumps({'batch':batch,'ids':ids,'expected_provider_before':before},indent=2)+'\n'
              payload={
                'message':f'Build: request Security-Auditing Batch {batch} rebuild',
                'content':base64.b64encode(body.encode()).decode(),
                'sha':cur['sha'],
                'branch':orch,
              }
              data=json.dumps(payload)
              subprocess.run(['gh','api','-X','PUT',f'repos/{repo}/contents/{req_path}','--input','-'],input=data,text=True,check=True,env=env,stdout=subprocess.DEVNULL)

          def validate_candidate(branch, expected_before, ids):
              c=gh(f'repos/{repo}/compare/main...{branch}')
              if c['ahead_by']!=1 or c['behind_by']!=0:
                  raise RuntimeError(f'branch relation invalid {branch}: ahead={c["ahead_by"]} behind={c["behind_by"]}')
              files=[x['filename'] for x in c.get('files',[])]
              if len(files)!=9:
                  raise RuntimeError(f'expected 9 durable files, got {len(files)}: {files}')
              bad=[p for p in files if p.startswith('tmp/') or p.startswith('.github/workflows/tmp-') or '__pycache__' in p or p.endswith('.pyc') or p.startswith('tools/tmp_')]
              if bad: raise RuntimeError(f'temporary/cache leak: {bad}')
              count,_=coverage()
              if count!=expected_before: raise RuntimeError(f'fresh-main coverage moved: {count} != {expected_before}')
              return c['commits'][-1]['sha'] if c.get('commits') else branch_sha(branch)

          def ensure_pr(batch,branch,ids,head):
              pr=find_open_pr(branch)
              if pr:
                  if pr['head']['sha']!=head: raise RuntimeError('existing PR head mismatch')
                  return int(pr['number'])
              title=f'Content: promote Windows Security-Auditing Batch {batch} ({ids[0]}-{ids[-1]})'
              body=(f'Fresh-main Batch {batch} promotion. Scope: '+','.join(map(str,ids))+'. '
                    'Provider discovery run 37940285199 and UWS verification run 37940429829 are checksum/artifact-bound. '
                    'Candidate was produced by the bounded fresh-main factory and validated for branch relation and durable-diff hygiene. '
                    'Merge only after all six required exact-head gates succeed.')
              pr=gh(f'repos/{repo}/pulls','POST',{'title':title,'head':branch,'base':'main','body':body})
              return int(pr['number'])

          def wait_gates(head,timeout=3600):
              end=time.time()+timeout
              while time.time()<end:
                  runs=gh(f'repos/{repo}/actions/runs?head_sha={head}&event=pull_request&per_page=100')['workflow_runs']
                  latest={}
                  for r in sorted(runs,key=lambda x:x['created_at']): latest[r['name']]=r
                  if required <= set(latest):
                      states={n:(latest[n]['status'],latest[n].get('conclusion')) for n in required}
                      bad={n:s for n,s in states.items() if s[0]=='completed' and s[1] != 'success'}
                      if bad: raise RuntimeError(f'exact-head gate failure on {head}: {bad}')
                      if all(states[n]==('completed','success') for n in required):
                          print('all-six-gates=SUCCESS head='+head,flush=True)
                          return
                  time.sleep(15)
              raise RuntimeError(f'timeout waiting exact-head gates {head}')

          def merge_pr(prnum,head):
              pr=gh(f'repos/{repo}/pulls/{prnum}')
              if pr['head']['sha']!=head: raise RuntimeError('PR head moved before merge')
              if pr['base']['ref']!='main': raise RuntimeError('PR base moved')
              result=gh(f'repos/{repo}/pulls/{prnum}/merge','PUT',{'sha':head,'merge_method':'squash'})
              if not result.get('merged'): raise RuntimeError(f'merge failed: {result}')
              return result['sha']

          def wait_coverage(target,timeout=300):
              end=time.time()+timeout
              while time.time()<end:
                  count,rem=coverage()
                  if count==target:
                      print(f'coverage={count}/423 remaining={rem}',flush=True)
                      return
                  if count>target: raise RuntimeError(f'coverage unexpectedly advanced to {count}, target={target}')
                  time.sleep(5)
              raise RuntimeError(f'timeout waiting coverage {target}')

          for batch in range(37,44):
              ids=scopes[batch]
              before=350+10*(batch-36)
              after=423 if batch==43 else before+10
              count,_=coverage()
              if count>=after:
                  print(f'Batch {batch}: already merged coverage={count}',flush=True)
                  continue
              if count!=before:
                  raise RuntimeError(f'Batch {batch}: expected main coverage {before}, got {count}')
              branch=f'content/windows-security-auditing-batch-{batch}-{ids[0]}-{ids[-1]}'
              head=branch_sha(branch)
              pr=find_open_pr(branch)
              if head is None:
                  if pr: raise RuntimeError(f'PR exists but branch missing: {branch}')
                  update_request(batch,ids,before)
                  head=wait_branch(branch)
              head=validate_candidate(branch,before,ids)
              prnum=ensure_pr(batch,branch,ids,head)
              print(f'Batch {batch}: PR #{prnum} head={head}',flush=True)
              wait_gates(head)
              merged_sha=merge_pr(prnum,head)
              print(f'Batch {batch}: merged main={merged_sha}',flush=True)
              wait_coverage(after)

          count,rem=coverage()
          if count!=423 or rem!=0: raise RuntimeError(f'final coverage invalid {count}/423 remaining={rem}')
          print('Batches 37-43 COMPLETE: Windows Security-Auditing 423/423',flush=True)
          PY
