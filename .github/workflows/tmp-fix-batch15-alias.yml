name: Temporary Batch 15 alias collision fix

on:
  push:
    branches:
      - content/windows-security-auditing-batch-15-4786-4797
    paths:
      - '.github/workflows/tmp-fix-batch15-alias.yml'

permissions:
  contents: write

jobs:
  fix-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply dependency-free targeted alias repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/encyclopedia/approved-exemplars.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows={str(x.get('native_event_id')):x for x in d['events'] if x.get('namespace')=='microsoft.windows.security'}
          assert '4784' in rows and '4791' in rows
          alias='A basic application group was changed.'
          assert alias in rows['4784']['aliases']
          assert alias in rows['4791']['aliases']
          rows['4791']['aliases']=[x for x in rows['4791']['aliases'] if x != alias]
          assert alias not in rows['4791']['aliases']
          assert {'4791','Event ID 4791','Windows 4791'} <= set(rows['4791']['aliases'])
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Targeted fail-closed check: the collision must now resolve to only 4784.
          owners=[]
          for eid,row in rows.items():
              if alias in row.get('aliases',[]): owners.append(eid)
          assert owners == ['4784'], owners
          print('batch15-targeted-alias-repair=PASS owners='+','.join(owners))
          PY
      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-fix-batch15-alias.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add content/encyclopedia/approved-exemplars.json
          git diff --cached --check
          git commit -m 'Fix: disambiguate Batch 15 application-group alias'
          git push origin "HEAD:${GITHUB_REF_NAME}"
