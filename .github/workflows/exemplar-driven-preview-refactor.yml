name: Exemplar-driven preview refactor

on:
  push:
    branches:
      - refactor/exemplar-driven-preview-acceptance
    paths:
      - .github/workflows/exemplar-driven-preview-refactor.yml

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/exemplar-driven-preview-acceptance
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply bounded refactor
        run: python tools/tmp_exemplar_driven_refactor.py

      - name: Validate lightweight contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/phase51010/test_windows_security_coverage_snapshot.py
          python tests/phase51010/test_exemplar_driven_preview_contract.py
          python -m py_compile tools/content/build_encyclopedia_records.py tools/release/build_engineering_preview_pack.py tools/release/probe_engineering_preview.py
          git diff --check

      - name: Stage generated workflow files for connector update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-workflows
          cp .github/workflows/foundation-hygiene.yml generated-workflows/foundation-hygiene.yml
          cp .github/workflows/phase5105-usable-data-preview.yml generated-workflows/phase5105-usable-data-preview.yml

      - name: Upload generated workflow files
        uses: actions/upload-artifact@v4
        with:
          name: exemplar-driven-generated-workflows
          path: generated-workflows/*.yml
          if-no-files-found: error
          retention-days: 1

      - name: Commit non-workflow product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ali RahimDabagh'
          git config user.email '118610577+cyber-sentinel@users.noreply.github.com'
          git add \
            tools/content/build_encyclopedia_records.py \
            tools/release/build_engineering_preview_pack.py \
            tools/release/probe_engineering_preview.py \
            tests/phase51010/test_exemplar_driven_preview_contract.py
          git diff --cached --check
          git commit -m 'Refactor: derive preview acceptance from approved exemplars'
          git push origin HEAD:refactor/exemplar-driven-preview-acceptance
