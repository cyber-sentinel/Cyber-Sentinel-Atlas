name: Temporary Security-Auditing 4753-4762 apply

on:
  push:
    branches:
      - content/windows-security-auditing-batch-12-4753-4762
    paths:
      - '.github/workflows/tmp-security-auditing-4753-4762-apply.yml'

permissions:
  actions: read
  contents: write

jobs:
  apply-bounded-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download trusted Batch 12 provider artifact
        uses: actions/download-artifact@v5
        with:
          name: security-auditing-4753-4762-provider-metadata
          path: .atlas-batch12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cyber-sentinel/Cyber-Sentinel-Atlas
          run-id: 37680802160

      - name: Verify and apply bounded Batch 12 evidence
        shell: bash
        env:
          ATLAS_DISCOVERY_JSON: .atlas-batch12/security-auditing-4753-4762.json
        run: |
          set -euo pipefail
          test "$(sha256sum "$ATLAS_DISCOVERY_JSON" | awk '{print $1}')" = "67a6e722b1b4da6f31a51c5c673b60079eec8d24b0d3734f9a290d1c2ce4e952"
          python3 tools/tmp_apply_security_auditing_4753_4762.py

      - name: Run focused dependency-free corpus validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          paths = [
              Path('tests/phase51010/test_windows_security_coverage_snapshot.py'),
              Path('tests/phase51010/test_windows_security_auditing_4743_4752.py'),
              Path('tests/phase51010/test_windows_security_auditing_4753_4762.py'),
          ]
          for idx, path in enumerate(paths):
              spec = importlib.util.spec_from_file_location(f'atlas_batch12_test_{idx}', path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              tests = [getattr(mod, name) for name in sorted(dir(mod)) if name.startswith('test_') and callable(getattr(mod, name))]
              assert tests, f'no tests discovered in {path}'
              for test in tests:
                  test()
              print(f'PASS {path} ({len(tests)} tests)')
          PY

      - name: Validate new inventory contract and evidence binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          p=Path('ingestion/inventories/windows-security-auditing-4753-4762-26100.telemetry.json')
          d=json.loads(p.read_text())
          assert d['ingestion_contract_version']=='1.0.0'
          assert d['inventory_contract_version']=='1.0.0'
          assert d['inventory_kind']=='telemetry'
          assert d['expected_identity_count']==10
          s=d['scope_metadata']
          assert s['provider']=='Microsoft-Windows-Security-Auditing'
          assert s['channel']=='Security'
          assert s['windows_build']=='26100'
          assert s['workflow_run_id']==37680802160
          assert s['artifact_id']==11508793624
          assert s['artifact_digest']=='sha256:5033778ccdf7a966a8fc16121f2bcdcd7d9652baf85bff51341b86c2940f7882'
          assert s['raw_artifact_sha256']=='sha256-67a6e722b1b4da6f31a51c5c673b60079eec8d24b0d3734f9a290d1c2ce4e952'
          assert s['provider_unique_event_id_count']==10
          assert s['provider_event_version_definition_count']==12
          assert [x['event_id'] for x in s['expected_identities']]==[str(x) for x in range(4753,4763)]
          payload=copy.deepcopy(d); payload.pop('digest',None)
          raw=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          assert d['digest']=='sha256-'+hashlib.sha256(raw).hexdigest()
          print('inventory-contract=PASS evidence-binding=PASS digest=PASS')
          PY

      - name: Remove temporary execution scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            tools/tmp_apply_security_auditing_4753_4762.py \
            .github/workflows/tmp-security-auditing-4753-4762-discovery.yml \
            .github/workflows/tmp-security-auditing-4753-4762-apply.yml
          rm -rf .atlas-batch12
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit bounded Batch 12 corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Content: promote Security-Auditing 4753-4762'
          git push origin "HEAD:${GITHUB_REF_NAME}"
