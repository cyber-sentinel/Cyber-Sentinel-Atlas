name: Foundation Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - "product/**"
      - "architecture/**"

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Phase 5.1 foundation
        run: python tools/validate_foundation.py

      - name: Validate Stage 1 architecture sync
        run: python tools/validate_stage1_sync.py

      - name: Install Phase 5.2 validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt

      - name: Validate Phase 5.2 canonical data model
        run: python tools/validate_phase52.py

      - name: Run Phase 5.2 model and invariant tests
        run: python -m unittest discover -s tests -v

      - name: Check sensitive filenames
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.pfx" -o -name ".env" \) | grep -q .; then
            echo "Potential secret-bearing file detected."
            exit 1
          fi
