name: Temporary fresh-main Security-Auditing batch rebuild

on:
  push:
    branches:
      - build/parallel-discovery-batches-14-19
    paths:
      - 'tmp/security-batch-request.json'

permissions:
  actions: read
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse bounded batch request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('tmp/security-batch-request.json').read_text())
          batch=int(r['batch'])
          assert 14 <= batch <= 20
          ids=[int(x) for x in r['ids']]
          assert len(ids)==10 and ids==sorted(ids)
          print(f'batch={batch}')
          print(f'first={ids[0]}')
          print(f'last={ids[-1]}')
          print('ids='+','.join(map(str,ids)))
          print(f'artifact_name=security-auditing-batch{batch}-provider-metadata-v2')
          print('artifact_run=' + ('37742066466' if batch==20 else '37721122416'))
          print(f'branch=content/windows-security-auditing-batch-{batch}-{ids[0]}-{ids[-1]}')
          PY

      - name: Preserve bounded promoter outside worktree
        shell: bash
        run: cp tools/tmp_parallel_promote_14_18.py /tmp/atlas-promote.py

      - name: Patch runtime promoter for Batch 19/20 evidence support
        shell: bash
        env:
          BATCH: ${{ steps.req.outputs.batch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('/tmp/atlas-promote.py')
          s=p.read_text()
          needle="18:{'artifact_id':11525997098,'artifact_digest':'sha256:58b3314d30f0230cf9fa5c4d9d6673a784b1ecb2e2e43729f2fc7c7bb4c624d6','raw_sha256':'sha256-e4f5948dbc8dfe8211f2cd4dc691fb0eb41c8da75971863501c32840f2fea725'}}\nDRUN=37721122416; URUN=37721608338; UART=11526525503"
          replacement="18:{'artifact_id':11525997098,'artifact_digest':'sha256:58b3314d30f0230cf9fa5c4d9d6673a784b1ecb2e2e43729f2fc7c7bb4c624d6','raw_sha256':'sha256-e4f5948dbc8dfe8211f2cd4dc691fb0eb41c8da75971863501c32840f2fea725'},\n19:{'artifact_id':11525347875,'artifact_digest':'sha256:e3ab983a4d0837ec9fb3632062bbe9126c9fbd46924368404653fdaf1f5aaa35','raw_sha256':'sha256-3030328b56a31a24a544ce2179a8fe0bb313bf615cc01bdf4506238b9b173148'},\n20:{'artifact_id':11534570319,'artifact_digest':'sha256:a032750e844bbfc13be8a9a3b6f3e68192b832a4d48b8a85efc983b2a8f28bfc','raw_sha256':'sha256-a203576c6c0b5f4b8044b69085ef9e2b3bc4c69bb130c6ecc1c96c4aacf67edf'}}\nDRUN=37721122416; URUN=37721608338; UART=11526525503"
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          batch=int(os.environ['BATCH'])
          base="DRUN=37721122416; URUN=37721608338; UART=11526525503\nUDIG='sha256:65deb6923706d4677d55660e7b06915a16243f0acdafd955d0f7918074f2a51e'\nURAW='sha256-613b59d20e3f6f5b10bd75f611e9d34a0174f47b4deac60547355b73c7ddee44'"
          if batch==19:
              repl="DRUN=37721122416; URUN=37722312601; UART=11526102512\nUDIG='sha256:2b800bf4a60d1458ac5f72f3851e2e7f547bb847119badfdeb51702d45ed75a3'\nURAW='sha256-33c501e1c52fb9aef7ced3459110a5f7da9f1da8d7e8cbcb64beb34bc36beab4'"
              assert s.count(base)==1
              s=s.replace(base,repl)
          elif batch==20:
              repl="DRUN=37742066466; URUN=37742066466; UART=11533508910\nUDIG='sha256:e823bae8903e88d1423e3f2e28170b1b559e5492f1011e632aceb0b4fd60c277'\nURAW='sha256-aa42f25fe483ba88f95e803f1d4935065c35f2fc91f88f535f83de8802fcd51f'"
              assert s.count(base)==1
              s=s.replace(base,repl)
          p.write_text(s)
          compile(s,'/tmp/atlas-promote.py','exec')
          print('runtime-promoter=PASS batch='+os.environ['BATCH'])
          PY

      - name: Download trusted provider artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.req.outputs.artifact_name }}
          path: /tmp/provider-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cyber-sentinel/Cyber-Sentinel-Atlas
          run-id: ${{ steps.req.outputs.artifact_run }}

      - name: Rebuild target branch from fresh main
        shell: bash
        env:
          BATCH: ${{ steps.req.outputs.batch }}
          BRANCH: ${{ steps.req.outputs.branch }}
          IDS: ${{ steps.req.outputs.ids }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C "$BRANCH" origin/main
          artifact="/tmp/provider-evidence/security-auditing-batch${BATCH}.json"
          test -f "$artifact"
          python3 /tmp/atlas-promote.py --batch "$BATCH" --artifact "$artifact"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          batch=int(os.environ['BATCH'])
          ids=os.environ['IDS'].split(',')
          p=Path('content/encyclopedia/sources/ultimate-windows-security-benchmark.json')
          if batch==14:
              assert not p.exists(), 'generic UWS benchmark source unexpectedly already exists before Batch 14'
              now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
              rec={
                'schema_version':'1.0.0','record_kind':'source','id':'atlas:source:atlas.source:ultimate-windows-security-benchmark',
                'record_revision':1,'created_at':now,'updated_at':now,'curation_status':'validated','namespace':'atlas.source',
                'canonical_key':'ultimate-windows-security-benchmark','title':'Ultimate Windows Security — Windows Security Log Encyclopedia benchmark',
                'publisher':'Monterey Technology Group, Inc.','source_class':'tier-c-secondary-research',
                'canonical_urls':['https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/default.aspx'],
                'official_status':'secondary-reference','license':{'status':'restricted'},
                'redistribution':{'policy':'prohibited','notes':'Coverage and Quick Detail review benchmark only; ATLAS does not redistribute substantial UWS prose.'},
                'freshness_policy':{'expected_update_cadence':'web-reference','stale_after_days':90},
                'change_detection_policy':{'strategy':'checksum','notes':'Controlled membership verification run 37721608338, artifact 11526525503, artifact digest sha256:65deb6923706d4677d55660e7b06915a16243f0acdafd955d0f7918074f2a51e.'}
              }
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          else:
              assert p.exists(), 'generic UWS benchmark source must already be present on fresh main'

          sources={json.loads(x.read_text())['id'] for x in Path('content/encyclopedia/sources').glob('*.json')}
          events=json.loads(Path('content/encyclopedia/approved-exemplars.json').read_text())['events']
          current=[x for x in events if str(x.get('native_event_id')) in set(ids) and x.get('namespace')=='microsoft.windows.security']
          assert len(current)==10
          for e in current:
              assert e['source_id'] in sources, (e['native_event_id'],e['source_id'])
              assert e['structural_source']['source_id'] in sources
              assert e['external_reference']['source_id'] in sources
          print('source-reference-integrity=PASS')
          PY

          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          batch=int(os.environ['BATCH'])
          paths=[Path('tests/phase51010/test_windows_security_coverage_snapshot.py'),Path(f'tests/phase51010/test_windows_security_auditing_batch{batch}.py')]
          if batch>14: paths.append(Path(f'tests/phase51010/test_windows_security_auditing_batch{batch-1}.py'))
          for idx,path in enumerate(paths):
              spec=importlib.util.spec_from_file_location(f'batch_rebuild_{idx}',path)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              tests=[getattr(mod,n) for n in sorted(dir(mod)) if n.startswith('test_') and callable(getattr(mod,n))]
              assert tests, path
              for test in tests:test()
              print(f'PASS {path} ({len(tests)} tests)')
          PY

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo 'Python cache artifact detected in staged diff' >&2
            exit 1
          fi
          git commit -m "Content: promote Security-Auditing Batch ${BATCH}"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
