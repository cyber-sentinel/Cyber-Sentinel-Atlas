name: Phase 5.10.3 Public Packaging Readiness

on:
  push:
    branches:
      - main
      - phase-5.10.3-public-packaging-control-plane
    paths:
      - 'docs/releases/public-packaging-and-distribution.md'
      - 'docs/releases/public-packaging-readiness.json'
      - 'tools/release/validate_public_packaging.py'
      - '.github/workflows/phase5103-public-packaging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/releases/public-packaging-and-distribution.md'
      - 'docs/releases/public-packaging-readiness.json'
      - 'tools/release/validate_public_packaging.py'
      - '.github/workflows/phase5103-public-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate PPR-06 packaging control plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/release/validate_public_packaging.py
