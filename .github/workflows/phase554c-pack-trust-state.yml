name: Phase 5.5.4C Pack Trust State

on:
  push:
    branches:
      - feature/phase-5.5.4c-pack-trust-state
      - main
    paths:
      - 'shared-core/go/**'
      - 'tools/pack/**'
      - 'tests/phase55/**'
      - '.github/workflows/phase554c-pack-trust-state.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shared-core/go/**'
      - 'tools/pack/**'
      - 'tests/phase55/**'
      - '.github/workflows/phase554c-pack-trust-state.yml'

permissions:
  contents: read

jobs:
  pack-trust-state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: atlas-linux
            runner_os: linux
          - os: windows-latest
            runner: atlas-windows
            runner_os: windows
    runs-on: [self-hosted, "${{ matrix.runner_os }}", x64, atlas-ci, "${{ matrix.runner }}"]
    defaults:
      run:
        working-directory: shared-core/go
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: shared-core/go/go.sum
      - name: Set up Python 3.12 (Linux)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Python 3.12 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($version -ne '3.12') { throw "Python 3.12 required; found $version" }
          python --version
      - name: Prepare Phase 5.5.2 Python oracle (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/atlas-phase554c-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -r ../../tools/pack/requirements-phase552.txt
          echo "ATLAS_PHASE554C_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare Phase 5.5.2 Python oracle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'atlas-phase554c-venv'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check -r ../../tools/pack/requirements-phase552.txt
          "ATLAS_PHASE554C_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify module graph
        run: go mod verify
      - name: Enforce accepted Phase 5.5.4 production dependency boundary
        run: >-
          python -c "import subprocess; rows=subprocess.check_output(['go','list','-m','all'], text=True).splitlines(); mods={p[0]:p[1] for p in (r.split() for r in rows) if len(p)>1}; assert mods.get('github.com/theupdateframework/go-tuf/v2')=='v2.4.2',mods.get('github.com/theupdateframework/go-tuf/v2'); assert mods.get('modernc.org/sqlite')=='v1.58.0',mods.get('modernc.org/sqlite'); assert mods.get('golang.org/x/text')=='v0.36.0',mods.get('golang.org/x/text')"
      - name: Format workspace for development validation
        run: go fmt ./...
      - name: Reject benchmark runtime imports
        run: python -c "from pathlib import Path; bad=[str(p) for p in Path('.').rglob('*.go') if 'benchmarks/shared-core/phase553' in p.read_text(encoding='utf-8')]; assert not bad, bad"
      - name: Run production Go unit and regression tests
        run: go test ./... -count=1
      - name: Run Phase 5.5.4C Python-oracle adversarial integration
        run: go test -tags=phase554c_integration ./internal/pack -count=1
      - name: Run Go vet
        run: go vet ./...
      - name: Build deterministic atlas-core pair
        run: >-
          go build -trimpath -buildvcs=false -ldflags "-X main.coreCommit=${{ github.sha }} -X main.coreVersion=0.1.0-dev" -o atlas-core-a ./cmd/atlas-core &&
          go build -trimpath -buildvcs=false -ldflags "-X main.coreCommit=${{ github.sha }} -X main.coreVersion=0.1.0-dev" -o atlas-core-b ./cmd/atlas-core
      - name: Verify same-input binary reproducibility
        run: python -c "import hashlib; a=hashlib.sha256(open('atlas-core-a','rb').read()).hexdigest(); b=hashlib.sha256(open('atlas-core-b','rb').read()).hexdigest(); assert a==b,(a,b); print(a)"
