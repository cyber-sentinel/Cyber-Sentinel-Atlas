name: Phase 5.10.1 Redistribution Closure

on:
  push:
    branches:
      - main
      - phase-5.10.1-redistribution-closure-prep
      - phase-5.10.1-tauri-redistribution-evidence
    paths:
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/releases/third-party-redistribution-closure.md'
      - 'docs/releases/third-party-redistribution-inventory.json'
      - 'tools/release/validate_redistribution_inventory.py'
      - 'tools/release/generate_tauri_redistribution_evidence.py'
      - 'tools/release/generate_public_preview_notice_bundle.py'
      - 'tools/release/generate_redistribution_freeze_manifest.py'
      - 'tools/release/validate_redistribution_freeze_manifest.py'
      - 'tools/release/validate_pinned_license_material.py'
      - 'tools/release/generate_go_license_material_evidence.py'
      - 'tools/release/validate_go_license_material_evidence.py'
      - 'tools/shared_core/phase554d_evidence.py'
      - '.github/workflows/phase554d-supply-chain-closure.yml'
      - 'third_party/license-material/**'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
      - 'benchmarks/desktop/phase56/candidates/tauri/tauri.conf.json'
      - 'benchmarks/desktop/phase56/candidates/tauri/build.rs'
      - 'benchmarks/desktop/phase56/candidates/tauri/www/**'
      - '.github/workflows/phase5101-redistribution-closure.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/releases/third-party-redistribution-closure.md'
      - 'docs/releases/third-party-redistribution-inventory.json'
      - 'tools/release/validate_redistribution_inventory.py'
      - 'tools/release/generate_tauri_redistribution_evidence.py'
      - 'tools/release/generate_public_preview_notice_bundle.py'
      - 'tools/release/generate_redistribution_freeze_manifest.py'
      - 'tools/release/validate_redistribution_freeze_manifest.py'
      - 'tools/release/validate_pinned_license_material.py'
      - 'tools/release/generate_go_license_material_evidence.py'
      - 'tools/release/validate_go_license_material_evidence.py'
      - 'tools/shared_core/phase554d_evidence.py'
      - '.github/workflows/phase554d-supply-chain-closure.yml'
      - 'third_party/license-material/**'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
      - 'benchmarks/desktop/phase56/candidates/tauri/tauri.conf.json'
      - 'benchmarks/desktop/phase56/candidates/tauri/build.rs'
      - 'benchmarks/desktop/phase56/candidates/tauri/www/**'
      - '.github/workflows/phase5101-redistribution-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  RUST_VERSION: '1.95.0'
  TAURI_LOCK_SHA256: 'dd2a97c412b0f7289f07ba16cfc28b4cca02ea9b7a5f5ed4d488b34977e37b3e'
  TAURI_MANIFEST: 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
  TAURI_LOCK: 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
  WINDOWS_TARGET: 'x86_64-pc-windows-msvc'

jobs:
  validate:
    name: validate PPR-04 redistribution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate fail-closed redistribution inventory
        run: python tools/release/validate_redistribution_inventory.py
      - name: Validate pinned upstream license material
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pinned-third-party-license-material.json"
          python tools/release/validate_pinned_license_material.py --evidence "$evidence"
          echo "PPR04_LICENSE_MATERIAL_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Rehearse deterministic redistribution freeze manifests
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ppr04-freeze-evidence"
          corpus="$work/corpus"
          software="$work/software"
          mkdir -p "$corpus" "$software"
          cp docs/releases/third-party-redistribution-inventory.json "$corpus/inventory.json"
          cp third_party/license-material/manifest.json "$corpus/license-material-manifest.json"
          cp benchmarks/desktop/phase56/candidates/tauri/Cargo.toml "$software/Cargo.toml"
          cp benchmarks/desktop/phase56/candidates/tauri/Cargo.lock "$software/Cargo.lock"

          corpus_one="$work/corpus-freeze-1.json"
          corpus_two="$work/corpus-freeze-2.json"
          software_one="$work/software-freeze-1.json"
          software_two="$work/software-freeze-2.json"

          python tools/release/generate_redistribution_freeze_manifest.py \
            --kind PUBLIC_PREVIEW_CORPUS \
            --release-commit "$GITHUB_SHA" \
            --input inventory="$corpus/inventory.json" \
            --input license-material="$corpus/license-material-manifest.json" \
            --output "$corpus_one"
          python tools/release/generate_redistribution_freeze_manifest.py \
            --kind PUBLIC_PREVIEW_CORPUS \
            --release-commit "$GITHUB_SHA" \
            --input inventory="$corpus/inventory.json" \
            --input license-material="$corpus/license-material-manifest.json" \
            --output "$corpus_two"
          cmp "$corpus_one" "$corpus_two"

          python tools/release/generate_redistribution_freeze_manifest.py \
            --kind SOFTWARE_PAYLOAD \
            --release-commit "$GITHUB_SHA" \
            --input cargo-manifest="$software/Cargo.toml" \
            --input cargo-lock="$software/Cargo.lock" \
            --output "$software_one"
          python tools/release/generate_redistribution_freeze_manifest.py \
            --kind SOFTWARE_PAYLOAD \
            --release-commit "$GITHUB_SHA" \
            --input cargo-manifest="$software/Cargo.toml" \
            --input cargo-lock="$software/Cargo.lock" \
            --output "$software_two"
          cmp "$software_one" "$software_two"

          python tools/release/validate_redistribution_freeze_manifest.py \
            --manifest "$corpus_one" \
            --artifacts-dir "$corpus" \
            --expected-kind PUBLIC_PREVIEW_CORPUS \
            --release-commit "$GITHUB_SHA"
          python tools/release/validate_redistribution_freeze_manifest.py \
            --manifest "$software_one" \
            --artifacts-dir "$software" \
            --expected-kind SOFTWARE_PAYLOAD \
            --release-commit "$GITHUB_SHA"

          printf '\n' >> "$corpus/inventory.json"
          if python tools/release/validate_redistribution_freeze_manifest.py \
              --manifest "$corpus_one" \
              --artifacts-dir "$corpus" \
              --expected-kind PUBLIC_PREVIEW_CORPUS \
              --release-commit "$GITHUB_SHA"; then
            echo "tampered corpus rehearsal unexpectedly validated" >&2
            exit 1
          fi

          sha256sum "$corpus_one" "$software_one" > "$work/freeze-manifest-digests.txt"
          echo "PPR04_FREEZE_REHEARSAL_DIR=$work" >> "$GITHUB_ENV"

      - name: Upload freeze-manifest rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5101-redistribution-freeze-manifest-rehearsal
          path: |
            ${{ env.PPR04_FREEZE_REHEARSAL_DIR }}/corpus-freeze-1.json
            ${{ env.PPR04_FREEZE_REHEARSAL_DIR }}/software-freeze-1.json
            ${{ env.PPR04_FREEZE_REHEARSAL_DIR }}/freeze-manifest-digests.txt
          if-no-files-found: error
          retention-days: 30

      - name: Prove deterministic Public Preview notice draft
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/public-preview-third-party-notices.draft.md"
          second="$RUNNER_TEMP/public-preview-third-party-notices.second.md"
          python tools/release/generate_public_preview_notice_bundle.py --output "$output"
          python tools/release/generate_public_preview_notice_bundle.py --output "$second"
          cmp "$output" "$second"
          grep -F 'Status: **DRAFT / NOT RELEASE AUTHORITY**' "$output"
          grep -F 'Release package SHA-256: `UNBOUND`' "$output"
          grep -F 'Redistribution state: **CONDITIONALLY_CLEARABLE**' "$output"
          echo "PPR04_NOTICE_DRAFT=$output" >> "$GITHUB_ENV"
      - name: Prove strict notice generation fails closed while PPR-04 is blocked
        shell: bash
        run: |
          set -euo pipefail
          package_sha="$(printf '0%.0s' {1..64})"
          output="$RUNNER_TEMP/must-not-be-a-release-notice.md"
          if python tools/release/generate_public_preview_notice_bundle.py \
              --release \
              --package-sha256 "$package_sha" \
              --output "$output"; then
            echo "strict PPR-04 notice generation unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -f "$output"
      - name: Upload deterministic notice and pinned-license evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5101-public-preview-notice-draft
          path: |
            ${{ env.PPR04_NOTICE_DRAFT }}
            ${{ env.PPR04_LICENSE_MATERIAL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  tauri-rust-asset-evidence:
    name: generate exact Tauri Rust and asset evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo +"$RUST_VERSION" --version
          rustc +"$RUST_VERSION" --version
      - name: Verify immutable Tauri lock
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$TAURI_LOCK" | awk '{print $1}')"
          test "$actual" = "$TAURI_LOCK_SHA256" || {
            echo "Tauri Cargo.lock digest drift: expected $TAURI_LOCK_SHA256 got $actual" >&2
            exit 1
          }
      - name: Generate exact Windows-target Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phase5101-tauri-redistribution"
          mkdir -p "$evidence"
          cargo +"$RUST_VERSION" metadata             --locked             --format-version 1             --filter-platform "$WINDOWS_TARGET"             --manifest-path "$TAURI_MANIFEST"             > "$evidence/cargo-metadata.json"
          {
            cargo +"$RUST_VERSION" --version
            rustc +"$RUST_VERSION" --version
            printf 'target=%s\n' "$WINDOWS_TARGET"
            printf 'cargo_lock_sha256=%s\n' "$TAURI_LOCK_SHA256"
            printf 'commit=%s\n' "$GITHUB_SHA"
          } > "$evidence/toolchain.txt"
          echo "TAURI_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
      - name: Run Tauri redistribution evidence unit tests
        run: python -m unittest tests.phase5101.test_tauri_redistribution_evidence -v
      - name: Generate fail-closed redistribution preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/release/generate_tauri_redistribution_evidence.py             --cargo-metadata "$TAURI_EVIDENCE_DIR/cargo-metadata.json"             --output "$TAURI_EVIDENCE_DIR/tauri-redistribution-evidence.json"             --target "$WINDOWS_TARGET"             --commit "$GITHUB_SHA"
      - name: Upload exact preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5101-tauri-redistribution-evidence
          path: |
            ${{ runner.temp }}/phase5101-tauri-redistribution/cargo-metadata.json
            ${{ runner.temp }}/phase5101-tauri-redistribution/tauri-redistribution-evidence.json
            ${{ runner.temp }}/phase5101-tauri-redistribution/toolchain.txt
          if-no-files-found: error
          retention-days: 30
