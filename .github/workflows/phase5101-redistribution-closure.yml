name: Phase 5.10.1 Redistribution Closure

on:
  push:
    branches:
      - main
      - phase-5.10.1-redistribution-closure-prep
      - phase-5.10.1-tauri-redistribution-evidence
    paths:
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/releases/third-party-redistribution-closure.md'
      - 'docs/releases/third-party-redistribution-inventory.json'
      - 'tools/release/validate_redistribution_inventory.py'
      - 'tools/release/generate_tauri_redistribution_evidence.py'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
      - 'benchmarks/desktop/phase56/candidates/tauri/tauri.conf.json'
      - 'benchmarks/desktop/phase56/candidates/tauri/build.rs'
      - 'benchmarks/desktop/phase56/candidates/tauri/www/**'
      - '.github/workflows/phase5101-redistribution-closure.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/releases/third-party-redistribution-closure.md'
      - 'docs/releases/third-party-redistribution-inventory.json'
      - 'tools/release/validate_redistribution_inventory.py'
      - 'tools/release/generate_tauri_redistribution_evidence.py'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
      - 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
      - 'benchmarks/desktop/phase56/candidates/tauri/tauri.conf.json'
      - 'benchmarks/desktop/phase56/candidates/tauri/build.rs'
      - 'benchmarks/desktop/phase56/candidates/tauri/www/**'
      - '.github/workflows/phase5101-redistribution-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  RUST_VERSION: '1.95.0'
  TAURI_LOCK_SHA256: 'dd2a97c412b0f7289f07ba16cfc28b4cca02ea9b7a5f5ed4d488b34977e37b3e'
  TAURI_MANIFEST: 'benchmarks/desktop/phase56/candidates/tauri/Cargo.toml'
  TAURI_LOCK: 'benchmarks/desktop/phase56/candidates/tauri/Cargo.lock'
  WINDOWS_TARGET: 'x86_64-pc-windows-msvc'

jobs:
  validate:
    name: validate PPR-04 redistribution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate fail-closed redistribution inventory
        run: python tools/release/validate_redistribution_inventory.py

  tauri-rust-asset-evidence:
    name: generate exact Tauri Rust and asset evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          cargo +"$RUST_VERSION" --version
          rustc +"$RUST_VERSION" --version
      - name: Verify immutable Tauri lock
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$TAURI_LOCK" | awk '{print $1}')"
          test "$actual" = "$TAURI_LOCK_SHA256" || {
            echo "Tauri Cargo.lock digest drift: expected $TAURI_LOCK_SHA256 got $actual" >&2
            exit 1
          }
      - name: Generate exact Windows-target Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phase5101-tauri-redistribution"
          mkdir -p "$evidence"
          cargo +"$RUST_VERSION" metadata             --locked             --format-version 1             --filter-platform "$WINDOWS_TARGET"             --manifest-path "$TAURI_MANIFEST"             > "$evidence/cargo-metadata.json"
          {
            cargo +"$RUST_VERSION" --version
            rustc +"$RUST_VERSION" --version
            printf 'target=%s\n' "$WINDOWS_TARGET"
            printf 'cargo_lock_sha256=%s\n' "$TAURI_LOCK_SHA256"
            printf 'commit=%s\n' "$GITHUB_SHA"
          } > "$evidence/toolchain.txt"
          echo "TAURI_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
      - name: Generate fail-closed redistribution preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/release/generate_tauri_redistribution_evidence.py             --cargo-metadata "$TAURI_EVIDENCE_DIR/cargo-metadata.json"             --output "$TAURI_EVIDENCE_DIR/tauri-redistribution-evidence.json"             --target "$WINDOWS_TARGET"             --commit "$GITHUB_SHA"
      - name: Upload exact preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5101-tauri-redistribution-evidence
          path: |
            ${{ env.TAURI_EVIDENCE_DIR }}/cargo-metadata.json
            ${{ env.TAURI_EVIDENCE_DIR }}/tauri-redistribution-evidence.json
            ${{ env.TAURI_EVIDENCE_DIR }}/toolchain.txt
          if-no-files-found: error
          retention-days: 30
