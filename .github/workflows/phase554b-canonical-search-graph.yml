name: Phase 5.5.4B Canonical Search Graph

on:
  push:
    branches:
      - feature/phase-5.5.4b-canonical-search-graph
      - feature/phase-5.5.4c-pack-trust-state
      - main
    paths:
      - 'shared-core/go/**'
      - '.github/workflows/phase554b-canonical-search-graph.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shared-core/go/**'
      - '.github/workflows/phase554b-canonical-search-graph.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  canonical-search-graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: atlas-linux
            runner_os: linux
          - os: windows-latest
            runner: atlas-windows
            runner_os: windows
    runs-on: [self-hosted, "${{ matrix.runner_os }}", x64, atlas-ci, "${{ matrix.runner }}"]
    defaults:
      run:
        working-directory: shared-core/go
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: shared-core/go/go.sum
      - name: Set up Python 3.12 (Linux)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Python 3.12 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($version -ne '3.12') { throw "Python 3.12 required; found $version" }
          python --version
      - name: Verify module graph
        run: go mod verify
      - name: Enforce gofmt
        run: go fmt ./... && git diff --exit-code -- .
      - name: Reject benchmark runtime imports
        run: python -c "from pathlib import Path; bad=[str(p) for p in Path('.').rglob('*.go') if 'benchmarks/shared-core/phase553' in p.read_text(encoding='utf-8')]; assert not bad, bad"
      - name: Enforce accepted production dependency boundary
        run: >-
          python -c "import subprocess; rows=subprocess.check_output(['go','list','-m','all'], text=True).splitlines(); mods={p[0]:p[1] for p in (r.split() for r in rows) if len(p)>1}; assert mods.get('modernc.org/sqlite')=='v1.58.0',mods.get('modernc.org/sqlite'); assert mods.get('golang.org/x/text')=='v0.36.0',mods.get('golang.org/x/text'); tuf=mods.get('github.com/theupdateframework/go-tuf/v2'); assert tuf in (None,'v2.4.2'),tuf"
      - name: Run production canonical/search/graph and Python-oracle parity tests
        run: go test ./... -count=1
      - name: Run Go vet
        run: go vet ./...
      - name: Build deterministic atlas-core pair
        run: >-
          go build -trimpath -buildvcs=false -ldflags "-X main.coreCommit=${{ github.sha }} -X main.coreVersion=0.1.0-dev" -o atlas-core-a ./cmd/atlas-core &&
          go build -trimpath -buildvcs=false -ldflags "-X main.coreCommit=${{ github.sha }} -X main.coreVersion=0.1.0-dev" -o atlas-core-b ./cmd/atlas-core
      - name: Verify same-input binary reproducibility
        run: python -c "import hashlib; a=hashlib.sha256(open('atlas-core-a','rb').read()).hexdigest(); b=hashlib.sha256(open('atlas-core-b','rb').read()).hexdigest(); assert a==b,(a,b); print(a)"
