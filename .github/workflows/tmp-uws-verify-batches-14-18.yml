name: Temporary UWS benchmark verification Batches 14-18

on:
  push:
    branches:
      - build/parallel-discovery-batches-14-19
    paths:
      - '.github/workflows/tmp-uws-verify-batches-14-18.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify planned identities exist in UWS benchmark index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, urllib.request
          planned=[4776,4777,4778,4779,4780,4781,4782,4783,4784,4785,
                   4786,4787,4788,4789,4790,4791,4792,4793,4794,4797,
                   4798,4799,4800,4801,4802,4803,4816,4817,4818,4819,
                   4820,4821,4822,4823,4824,4825,4826,4830,4864,4865,
                   4866,4867,4868,4869,4870,4871,4872,4873,4874,4875]
          url='https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/default.aspx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ATLAS-Controlled-Review/1.0'})
          raw=urllib.request.urlopen(req,timeout=30).read()
          text=raw.decode('utf-8','replace')
          ids={int(x) for x in re.findall(r'event(?:\.aspx)?\?eventid=(\d+)',text,re.I)}
          if len(ids)<400:
              ids.update(int(x) for x in re.findall(r'eventid[=:\"\'\s]+(\d{3,5})',text,re.I))
          missing=[x for x in planned if x not in ids]
          assert len(ids)>=400, f'benchmark extraction unexpectedly small: {len(ids)}'
          assert not missing, f'planned IDs absent from benchmark: {missing}'
          evidence={'source_url':url,'retrieved_unique_ids':len(ids),'planned_count':len(planned),'planned_ids':planned,'missing':missing,'raw_sha256':'sha256-'+hashlib.sha256(raw).hexdigest()}
          open('uws-batches-14-18-verification.json','w').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uws-batches-14-18-verification
          path: uws-batches-14-18-verification.json
          if-no-files-found: error
          retention-days: 7
