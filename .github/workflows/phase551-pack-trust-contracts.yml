name: Phase 5.5.1 Pack Trust Contracts

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "docs/adr/0023-secure-content-pack-trust-and-update-model.md"
      - "docs/architecture/atlas-tuf-pouf-v1.md"
      - "docs/architecture/phase-5.5.1-pack-trust-contracts.md"
      - "schemas/pack/**"
      - "tools/pack/**"
      - "tests/phase55/**"
      - "tests/fixtures/phase55/**"
      - ".github/workflows/phase551-pack-trust-contracts.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".gitattributes"
      - "docs/adr/0023-secure-content-pack-trust-and-update-model.md"
      - "docs/architecture/atlas-tuf-pouf-v1.md"
      - "docs/architecture/phase-5.5.1-pack-trust-contracts.md"
      - "schemas/pack/**"
      - "tools/pack/**"
      - "tests/phase55/**"
      - "tests/fixtures/phase55/**"
      - ".github/workflows/phase551-pack-trust-contracts.yml"

permissions:
  contents: read

jobs:
  pack-contracts:
    name: pack-contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: atlas-linux
          - os: windows-latest
            runner: atlas-windows
    runs-on: [self-hosted, atlas-ci, "${{ matrix.runner }}"]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python (Linux)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare Python 3.12 venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($version -ne '3.12') { throw "Python 3.12 required; found $version" }
          $venv = Join-Path $env:RUNNER_TEMP 'atlas-python-venv'
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          python -m venv $venv
          $scripts = Join-Path $venv 'Scripts'
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $scripts 'python.exe') --version

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 jsonschema==4.25.1

      - name: Compile pack validation modules
        run: python -m py_compile tools/pack/contract.py tools/pack/validate_phase551.py

      - name: Run Phase 5.5.1 contract and security tests
        run: python -m pytest -q tests/phase55/test_phase551_pack_contracts.py

      - name: Run Phase 5.5.1 closure validator
        run: python tools/pack/validate_phase551.py

      - name: Confirm canonical schemas v1 are unchanged from main
        if: github.ref != 'refs/heads/main'
        run: git diff --exit-code origin/main...HEAD -- schemas/v1
