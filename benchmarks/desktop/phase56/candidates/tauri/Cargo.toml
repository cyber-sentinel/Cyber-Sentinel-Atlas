[package]
name = "atlas-tauri-candidate"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde_json = "1"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
