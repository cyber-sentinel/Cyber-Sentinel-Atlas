    <g transform="translate(320 190)"><rect width="200" height="170" rx="22" fill="#0b1f3a" stroke="#3b82f6" stroke-width="2"/><rect x="42" y="34" width="116" height="62" rx="10" fill="#111827" stroke="#60a5fa"/><path d="M60 54 H140 M60 72 H122" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="100" y="125" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Quick Answer</text><text x="100" y="149" text-anchor="middle" fill="#94a3b8" font-size="12">What happened &amp; why it matters</text></g>
    <g transform="translate(560 190)"><rect width="200" height="170" rx="22" fill="#0b1f3a" stroke="#3b82f6" stroke-width="2"/><rect x="42" y="32" width="116" height="70" rx="10" fill="#111827" stroke="#60a5fa"/><path d="M60 50 H140 M60 67 H140 M60 84 H118" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/><text x="100" y="125" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Fields &amp; Example</text><text x="100" y="149" text-anchor="middle" fill="#94a3b8" font-size="12">Version-aware telemetry detail</text></g>
    <g transform="translate(800 190)"><rect width="200" height="170" rx="22" fill="#0b1f3a" stroke="#14b8a6" stroke-width="2"/><path d="M52 92 L100 42 L148 92 L100 116 Z" fill="#0f2d2a" stroke="#5eead4" stroke-width="2"/><circle cx="100" cy="42" r="8" fill="#5eead4"/><circle cx="52" cy="92" r="8" fill="#5eead4"/><circle cx="148" cy="92" r="8" fill="#5eead4"/><circle cx="100" cy="116" r="8" fill="#5eead4"/><text x="100" y="145" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Provenance</text></g>
    <g transform="translate(1040 190)"><rect width="200" height="170" rx="22" fill="#0b1f3a" stroke="#8b5cf6" stroke-width="2"/><circle cx="100" cy="68" r="18" fill="#7c3aed"/><circle cx="55" cy="45" r="11" fill="#c084fc"/><circle cx="150" cy="45" r="11" fill="#c084fc"/><circle cx="55" cy="105" r="11" fill="#c084fc"/><circle cx="150" cy="105" r="11" fill="#c084fc"/><path d="M68 54 L84 62 M132 54 L116 62 M68 98 L84 78 M132 98 L116 78" stroke="#d8b4fe" stroke-width="3"/><text x="100" y="145" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Mind Map</text></g>
    <g transform="translate(1280 190)"><rect width="140" height="170" rx="22" fill="#0b1f3a" stroke="#22d3ee" stroke-width="2"/><circle cx="70" cy="70" r="34" fill="#082f49" stroke="#67e8f9" stroke-width="2"/><circle cx="70" cy="70" r="16" fill="url(#blue)"/><path d="M70 28 C92 40 104 58 108 78 M34 84 C44 108 64 120 86 118" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/><text x="70" y="133" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">ATLAS</text><text x="70" y="152" text-anchor="middle" fill="#67e8f9" font-size="11">Entity guidance</text></g>
  </g>

  <g stroke="#5eead4" stroke-width="4" marker-end="url(#a)"><path d="M280 275 H312"/><path d="M520 275 H552"/><path d="M760 275 H792"/><path d="M1000 275 H1032"/><path d="M1240 275 H1272"/></g>

  <rect x="170" y="438" width="1160" height="185" rx="28" fill="#0b1324" stroke="#1e293b"/>
  <text x="750" y="482" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Investigation Depth</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14">
    <rect x="220" y="520" width="210" height="60" rx="16" fill="#0f172a" stroke="#334155"/><text x="325" y="545" text-anchor="middle" fill="#f8fafc" font-weight="700">Facts &amp; Evidence</text><text x="325" y="566" text-anchor="middle" fill="#94a3b8">Observed, attributable, source-backed</text>
    <rect x="475" y="520" width="210" height="60" rx="16" fill="#0f172a" stroke="#334155"/><text x="580" y="545" text-anchor="middle" fill="#f8fafc" font-weight="700">Hypotheses</text><text x="580" y="566" text-anchor="middle" fill="#94a3b8">Supports • Refutes • Confidence</text>
    <rect x="730" y="520" width="210" height="60" rx="16" fill="#0f172a" stroke="#334155"/><text x="835" y="545" text-anchor="middle" fill="#f8fafc" font-weight="700">Correlations</text><text x="835" y="566" text-anchor="middle" fill="#94a3b8">Related records, pivots, timelines</text>
    <rect x="985" y="520" width="210" height="60" rx="16" fill="#0f172a" stroke="#334155"/><text x="1090" y="545" text-anchor="middle" fill="#f8fafc" font-weight="700">Advanced</text><text x="1090" y="566" text-anchor="middle" fill="#94a3b8">Canonical/raw diagnostics on demand</text>
  </g>

  <text x="750" y="690" text-anchor="middle" fill="#5eead4" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Deterministic retrieval first • Grounded assistance second • Hidden chain-of-thought never exposed</text>
</svg>