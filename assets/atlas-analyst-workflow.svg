<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS analyst workflow</title>
  <desc id="desc">Search-first investigation flow from query to quick answer, record detail, provenance, graph context, and ATLAS Entity guidance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061425"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1500" height="760" rx="30" fill="url(#bg)"/>
  <text x="750" y="72" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">ATLAS Analyst Workflow</text>
  <text x="750" y="108" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Primary page answers fast. Secondary views expose evidence, structure, and investigation depth.</text>

